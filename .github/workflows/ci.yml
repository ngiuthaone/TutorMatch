name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
        with:
          version: 9
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  policy:
    name: Policy (security policy validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate security policies
        run: python3 scripts/validate-policies.py ci

  discover:
    name: Discover (typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discover
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@39370e3970a6d050c480ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: discover/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm run lint
      - run: npm test
      - run: npm run build

  supabase-schema:
    name: Supabase (schema + RLS validation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: supabase/setup-cli@2eb3ca6f0c46ccd31e43d6a5f3b0dc0a4d70b6cd # v3
        with:
          supabase-url: ${{ vars.SUPABASE_URL }}
          supabase-api-key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Push migrations dry-run (validates all migrations apply cleanly)
      - name: Validate migrations (dry-run)
        run: |
          cd backend
          supabase db push --dry-run

      # Check RLS policies exist on key tables
      - name: Verify RLS policies on key tables
        run: |
          cd backend
          supabase inspect db rls-policies --json > rls_policies.json
          python3 -c "
import json
with open('rls_policies.json') as f:
    data = json.load(f)
tables = ['profiles','bookings','payments','marketplace_listings',
           'messages','notifications','posts','comments',
           'articles','sessions','reschedule_requests']
missing = [t for t in tables if not any(p.get('tablename','') == t for p in data)]
if missing:
    print('ERROR: Tables without RLS:', ', '.join(missing))
    exit(1)
print('OK: All key tables have RLS policies')
"

      # Verify critical indexes exist
      - name: Verify critical indexes
        run: |
          cd backend
          supabase inspect db indexes --json > indexes.json
          python3 -c "
import json
with open('indexes.json') as f:
    data = json.load(f)
checks = [
    ('bookings', 'sessions_offering_id'),
    ('bookings', 'bookings_learner'),
    ('marketplace_listings', 'creator'),
    ('profiles', 'profiles_role'),
    ('reschedule_requests', 'booking_status'),
]
errors = []
for tbl, idx_name in checks:
    found = any(
        p.get('tablename','') == tbl and
        (p.get('indexname','') == idx_name or idx_name in p.get('indexname',''))
        for p in data
    )
    if not found:
        errors.append(f'Missing: {idx_name} on {tbl}')
if errors:
    print('ERRORS:')
    for e in errors: print(' -', e)
    exit(1)
print('OK: All critical indexes present')
"

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, discover]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: discover/package-lock.json

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
        with:
          version: 9

      - uses: supabase/setup-cli@2eb3ca6f0c46ccd31e43d6a5f3b0dc0a4d70b6cd # v3
        with:
          version: 2.114.0

      - name: Install Playwright browsers
        working-directory: discover
        run: npx playwright install --with-deps chromium

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Install discover dependencies
        working-directory: discover
        run: npm ci

      - name: Start Supabase
        working-directory: backend
        run: supabase start

      - name: Start backend
        working-directory: backend
        run: |
          pnpm run dev > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
        env:
          NODE_ENV: test
          TUTORIA_ENVIRONMENT: development
          HOST: 127.0.0.1
          PORT: 4000
          FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_TEST_KEY
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_TEST_KEY
          TRUST_PROXY: false
          RATE_LIMIT_MAX: 1000
          RATE_LIMIT_WINDOW_MS: 60000

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:4000/healthz > /dev/null 2>&1; then
              echo "Backend ready"
              exit 0
            fi
            sleep 3
          done
          echo "Backend failed"
          cat /tmp/backend.log
          exit 1

      - name: Start frontend
        working-directory: discover
        run: |
          npm run dev > /tmp/frontend.log 2>&1 &
          echo $! > /tmp/frontend.pid
        env:
          PORT: 3000
          NEXT_PUBLIC_TUTORIA_API_BASE_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_TEST_KEY
          NEXT_PUBLIC_TUTORIA_AUTH_CALLBACK_URL: http://127.0.0.1:3000/auth/callback
          NEXT_PUBLIC_TUTORIA_DEMO_MODE: false
          NEXT_PUBLIC_TUTORIA_ENVIRONMENT: development
          NEXT_PUBLIC_USE_BFF_AUTH: false

      - name: Wait for frontend
        run: |
          for i in $(seq 1 60); do
            if curl -s http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "Frontend ready"
              exit 0
            fi
            sleep 3
          done
          echo "Frontend failed"
          cat /tmp/frontend.log
          exit 1

      - name: Run E2E tests
        working-directory: discover
        run: npm run test:e2e
        env:
          BASE_URL: http://127.0.0.1:3000
          E2E_BASE_URL: http://127.0.0.1:3000
          CI: "true"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: discover/playwright-report/
          retention-days: 30
