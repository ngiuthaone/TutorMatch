name: Keep Render Warm
on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 minutes
  workflow_dispatch:  # manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping Render backend
        run: |
          curl -fsS https://tutoria-api-purb.onrender.com/api/v1/offerings > /dev/null \
            && echo "Backend awake" \
            || echo "Backend may be sleeping"
