<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse workshops</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --panel: #111113;
      --panel-2: #171719;
      --line: #2a2a2e;
      --line-strong: #3a3a40;
      --text: #f5f5f6;
      --muted: #98989f;
      --soft: #c9c9ce;
      --chip: #1c1c1f;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .page { width: min(1440px, calc(100% - 40px)); margin: 0 auto; padding: 114px 0 64px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .search-wrap { position: relative; width: min(520px, 100%); }
    .search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: #717178; pointer-events: none; }
    .search {
      width: 100%; height: 40px; border: 1px solid var(--line); border-radius: 11px; outline: none;
      background: var(--panel); color: var(--text); padding: 0 14px 0 40px; font-size: 14px;
      transition: border-color .2s ease, background .2s ease;
    }
    .search::placeholder { color: #696970; }
    .search:focus { border-color: #4a4a51; background: #141416; }
    .toolbar-actions { display: flex; align-items: center; gap: 10px; }
    .select-wrap { position: relative; }
    .sort {
      height: 40px; min-width: 166px; appearance: none; border: 1px solid var(--line); border-radius: 11px;
      background: var(--panel); color: var(--soft); padding: 0 38px 0 14px; outline: none; font-size: 13px; font-weight: 600;
    }
    .select-wrap svg { position: absolute; width: 15px; height: 15px; right: 13px; top: 50%; transform: translateY(-50%); color: #74747b; pointer-events: none; }
    .mobile-filter-button { display: none; height: 40px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel); padding: 0 14px; }
    .active-row { min-height: 34px; margin-top: 14px; display: flex; align-items: center; gap: 8px; overflow-x: auto; }
    .active-row[hidden] { display: none; }
    .active-label { color: #6f6f76; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
    .active-list { display: flex; gap: 8px; }
    .active-chip { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; background: var(--chip); color: #d7d7db; font-size: 12px; cursor: pointer; }
    .active-chip:hover { border-color: #4a4a50; color: white; }
    .active-chip svg { width: 12px; height: 12px; color: #82828a; }
    .clear-active { border: 0; background: transparent; color: #85858c; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .clear-active:hover { color: white; }

    .layout { display: grid; grid-template-columns: 238px minmax(0, 1fr); gap: 28px; margin-top: 22px; align-items: start; }
    .filters { position: sticky; top: 22px; margin-top: 54px; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); overflow: hidden; }
    .filters-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 17px; }
    .filters-title { font-size: 14px; font-weight: 650; }
    .clear-button { border: 0; background: transparent; color: #85858d; font-size: 11px; cursor: pointer; padding: 3px; }
    .clear-button:hover { color: white; }
    .filter-group { padding: 16px 17px; border-top: 1px solid var(--line); }
    .filter-group h3 { margin: 0 0 12px; color: #7d7d84; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; }
    .options { display: grid; gap: 11px; }
    .option { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #c7c7cc; font-size: 13px; cursor: pointer; }
    .option span { min-width: 0; }
    .option input { width: 15px; height: 15px; margin: 0; accent-color: white; flex: 0 0 auto; }

    .results { min-width: 0; }
    .results-head { display: flex; align-items: center; justify-content: flex-end; min-height: 34px; margin-bottom: 14px; }
    .view-toggle { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
    .view-button { width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 999px; background: transparent; color: #77777e; cursor: pointer; }
    .view-button.active { background: #28282c; color: white; }
    .view-button svg { width: 15px; height: 15px; }

    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card-link { display: block; min-width: 0; color: inherit; text-decoration: none; }
    .card { min-width: 0; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 20px; background: var(--panel); transition: transform .2s ease, border-color .2s ease; }
    .card:hover { transform: translateY(-2px); border-color: #3d3d43; }
    .card[hidden] { display: none !important; }
    .media { position: relative; aspect-ratio: 16 / 10; min-height: 0; overflow: hidden; background: var(--gradient); }
    .media-image { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center; transition: transform .35s ease; }
    .card:hover .media-image { transform: scale(1.025); }
    .media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.04), rgba(0,0,0,.30)); }
    .format-badge, .date-badge, .spots, .save { position: absolute; z-index: 1; }
    .format-badge { left: 13px; top: 13px; height: 25px; display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid rgba(255,255,255,.09); border-radius: 999px; background: rgba(9,9,10,.58); backdrop-filter: blur(10px); color: #f3f3f4; font-size: 9px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
    .save { right: 13px; top: 13px; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.09); border-radius: 50%; background: rgba(9,9,10,.58); backdrop-filter: blur(10px); cursor: pointer; }
    .save svg { width: 14px; height: 14px; }
    .date-badge { left: 13px; bottom: 13px; padding: 8px 10px; border: 1px solid rgba(255,255,255,.09); border-radius: 11px; background: rgba(9,9,10,.58); backdrop-filter: blur(10px); }
    .date-badge small { display: block; color: #a6a6ac; font-size: 8px; font-weight: 650; letter-spacing: .11em; text-transform: uppercase; }
    .date-badge strong { display: block; margin-top: 3px; font-size: 12px; font-weight: 650; }
    .spots { right: 13px; bottom: 13px; height: 28px; display: inline-flex; align-items: center; padding: 0 11px; border-radius: 999px; background: rgba(246,246,247,.95); color: #121214; font-size: 10px; font-weight: 750; }
    .card-body { display: flex; flex: 1; flex-direction: column; padding: 16px; min-height: 178px; }
    .eyebrow-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .topic { color: #85858c; font-size: 9px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; }
    .price { font-size: 13px; font-weight: 700; white-space: nowrap; }
    .card h2 { margin: 11px 0 0; font-size: 16px; line-height: 1.35; letter-spacing: -.018em; }
    .host { margin: 7px 0 0; color: #8f8f96; font-size: 12px; line-height: 1.5; }
    .summary { display: none; margin: 9px 0 0; max-width: 700px; color: #a6a6ad; font-size: 12px; line-height: 1.55; }
    .detail-grid { display: none; }
    .list-actions { display: none; }
    .location { display: flex; align-items: center; gap: 7px; min-height: 31px; margin-top: auto; padding-top: 13px; border-top: 1px solid var(--line); color: #babac0; font-size: 11px; }
    .location svg { width: 14px; height: 14px; color: #74747b; flex: 0 0 auto; }

    .cards.list { grid-template-columns: 1fr; gap: 12px; }
    .cards.list .card {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      min-height: 218px;
      border-radius: 18px;
    }
    .cards.list .media {
      aspect-ratio: auto;
      width: 248px;
      height: 100%;
      min-height: 218px;
    }
    .cards.list .card-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 138px;
      grid-template-rows: auto 1fr auto;
      column-gap: 24px;
      min-height: 218px;
      padding: 20px 22px;
    }
    .cards.list .eyebrow-row {
      grid-column: 1 / -1;
      align-self: start;
    }
    .cards.list .price { display: none; }
    .cards.list .card h2 {
      grid-column: 1;
      margin-top: 10px;
      font-size: 19px;
      line-height: 1.3;
    }
    .cards.list .host {
      grid-column: 1;
      margin-top: 5px;
    }
    .cards.list .summary {
      display: block;
      grid-column: 1;
    }
    .cards.list .detail-grid {
      display: grid;
      grid-column: 1;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
      margin-top: 15px;
    }

      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,.018);

      grid-row: 2 / 4;

    .drawer-panel { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow: auto; border-radius: 24px 24px 0 0; border: 1px solid var(--line); background: var(--panel); padding: 20px; }

      .view-toggle { display: none; }
      .cards:not(.list) .card-body {
        min-height: 174px;
        padding: 17px 18px 16px;
      }
      .cards:not(.list) .card h2 {
        font-size: 17px;
      }
      .cards:not(.list) .host {
        font-size: 12.5px;
      }
      .cards:not(.list) .location {
        font-size: 11.5px;
      }
      .cards.list .card { display: flex; min-height: 0; }
      .cards.list .media { aspect-ratio: 16 / 10; height: auto; min-height: 0; }
      .cards.list .card-body { min-height: 178px; padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="toolbar" aria-label="Browse controls">
      <label class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="search" class="search" type="search" placeholder="Search workshops, topics, or hosts" />
      </label>
      <div class="toolbar-actions">
        <button id="mobileFilterButton" class="mobile-filter-button" type="button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>
          Filters <span id="filterCount"></span>
        </button>
        <label class="select-wrap">
          <select id="sort" class="sort">
            <option value="soonest">Soonest</option>
            <option value="recommended">Recommended</option>
            <option value="nearest">Nearest</option>
            <option value="popular">Most popular</option>
            <option value="newest">Newest</option>
            <option value="price">Price: low to high</option>
          </select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m7 10 5 5 5-5"></path></svg>
        </label>
      </div>
    </section>

    <section id="activeRow" class="active-row" hidden>
      <span class="active-label">Active filters</span>
      <div id="activeList" class="active-list"></div>
      <button id="clearActive" class="clear-active" type="button">Clear all</button>
    </section>

    <div class="layout">
      <aside id="desktopFilters" class="filters" aria-label="Filters"></aside>

      <section class="results">
        <div class="results-head">
          <div class="view-toggle" aria-label="View options">
            <button id="gridView" class="view-button active" type="button" aria-label="Grid view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
            </button>
            <button id="listView" class="view-button" type="button" aria-label="List view">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 6h11M9 12h11M9 18h11"></path><circle cx="4.5" cy="6" r=".75" fill="currentColor"></circle><circle cx="4.5" cy="12" r=".75" fill="currentColor"></circle><circle cx="4.5" cy="18" r=".75" fill="currentColor"></circle></svg>
            </button>
          </div>
        </div>
        <div id="cards" class="cards"></div>
        <div id="empty" class="empty">
          <h2>No matching experiences</h2>
          <p>Try removing a filter or using a different search.</p>
          <button id="emptyClear" type="button">Clear filters</button>
        </div>
      </section>
    </div>
  </main>

  <div id="drawer" class="drawer" aria-hidden="true">
    <div id="backdrop" class="backdrop"></div>
    <section class="drawer-panel">
      <div class="drawer-head">
        <h2>Filters</h2>
        <button id="drawerClose" class="drawer-close" type="button" aria-label="Close filters">×</button>
      </div>
      <div id="mobileFilters"></div>
      <div class="drawer-actions">
        <button id="mobileClear" type="button">Clear</button>
        <button id="mobileApply" class="apply" type="button">Show results</button>
      </div>
    </section>
  </div>

  <script>
    const events = [
      {id:1,slug:"pizza-4ps-pizza-making-workshop",title:"Pizza 4P’s Pizza-Making Workshop",host:"Pizza 4P’s Workshop Team",topic:"Cooking",topicKey:"cooking",format:"In person",formatKey:"in-person",level:"Beginner",levelKey:"beginner",date:"Sun, 26 Jul",time:"09:00 AM",location:"Hoan Kiem, Ha Noi",spots:"14/20 spots",price:650000,priceLabel:"650,000₫",popularity:14,order:1,image:"https://images.unsplash.com/photo-1579751626657-72bc17010498?auto=format&fit=crop&w=1800&q=88",gradient:"radial-gradient(circle at 68% 68%, rgba(192,113,62,.28), transparent 24%), linear-gradient(135deg,#413a36,#1a1919 72%)"},
      {id:2,slug:"beginner-pottery-workshop",title:"Beginner Pottery Workshop",host:"Thu Ha",topic:"Creative arts",topicKey:"creative-arts",format:"In person",formatKey:"in-person",level:"Beginner",levelKey:"beginner",date:"Sun, 19 Jul",time:"02:00 PM",location:"Tay Ho, Ha Noi",spots:"12/20 spots",price:350000,priceLabel:"350,000₫",popularity:12,order:2,image:"/images/pottery-workshop-hero-optimized.jpg",gradient:"radial-gradient(circle at 35% 35%, rgba(211,183,151,.22), transparent 25%), linear-gradient(140deg,#50483f,#1b1a1a 74%)"},
      {id:3,slug:"ielts-speaking-practice-group",title:"IELTS Speaking Practice Group",host:"Linh Nguyen",topic:"Languages",topicKey:"languages",format:"Online",formatKey:"online",level:"Intermediate",levelKey:"intermediate",date:"Sat, 18 Jul",time:"10:00 AM",location:"Online",spots:"8/15 spots",price:0,priceLabel:"Free",popularity:8,order:3,image:"https://picsum.photos/seed/ev-ielts/1200/800",gradient:"radial-gradient(circle at 35% 35%, rgba(125,163,219,.22), transparent 26%), linear-gradient(140deg,#343e4d,#1a1b1e 72%)"},
      {id:4,slug:"startup-networking-night",title:"Startup Networking Night",host:"Bao Long",topic:"Business",topicKey:"business",format:"In person",formatKey:"in-person",level:"All levels",levelKey:"all-levels",date:"Fri, 24 Jul",time:"06:30 PM",location:"Hoan Kiem, Ha Noi",spots:"45/60 spots",price:0,priceLabel:"Free",popularity:45,order:4,image:"https://picsum.photos/seed/ev-startup/1200/800",gradient:"radial-gradient(circle at 72% 36%, rgba(197,145,222,.18), transparent 23%), linear-gradient(140deg,#423946,#1b191c 72%)"},
      {id:5,slug:"watercolor-painting-session",title:"Watercolor Painting Session",host:"Duc Pham",topic:"Creative arts",topicKey:"creative-arts",format:"Online",formatKey:"online",level:"Beginner",levelKey:"beginner",date:"Tue, 21 Jul",time:"03:00 PM",location:"Online",spots:"20/25 spots",price:200000,priceLabel:"200,000₫",popularity:20,order:5,image:"https://picsum.photos/seed/ev-watercolor/1200/800",gradient:"radial-gradient(circle at 25% 30%, rgba(220,137,149,.18), transparent 22%), radial-gradient(circle at 72% 58%, rgba(119,165,214,.22), transparent 24%), linear-gradient(140deg,#3e3f46,#1b1b1e 74%)"},
      {id:6,slug:"photography-walk-old-quarter",title:"Photography Walk: Old Quarter",host:"Duc Pham",topic:"Photography",topicKey:"photography",format:"In person",formatKey:"in-person",level:"All levels",levelKey:"all-levels",date:"Sun, 26 Jul",time:"07:00 AM",location:"Hoan Kiem, Ha Noi",spots:"15/15 spots",price:0,priceLabel:"Free",popularity:15,order:6,image:"https://picsum.photos/seed/ev-photowalk/1200/800",gradient:"radial-gradient(circle at 72% 34%, rgba(213,178,122,.19), transparent 23%), linear-gradient(140deg,#3a4147,#191a1b 72%)"},
      {id:7,slug:"yoga-in-the-park",title:"Yoga in the Park",host:"Ngoc Tram",topic:"Wellness",topicKey:"wellness",format:"In person",formatKey:"in-person",level:"Beginner",levelKey:"beginner",date:"Sat, 25 Jul",time:"06:30 AM",location:"Tay Ho, Ha Noi",spots:"28/30 spots",price:0,priceLabel:"Free",popularity:28,order:7,image:"https://picsum.photos/seed/ev-yoga/1200/800",gradient:"radial-gradient(circle at 32% 35%, rgba(169,199,177,.20), transparent 25%), linear-gradient(140deg,#37403b,#191b1a 72%)"}
    ];

    const config = [
      {title:"Format", type:"radio", key:"format", values:[["all","Any format"],["online","Online"],["in-person","In person"]]},
      {title:"Topic", type:"checkbox", key:"topics", values:[["cooking","Cooking"],["creative-arts","Creative arts"],["languages","Languages"],["business","Business"],["photography","Photography"],["wellness","Wellness"],["personal-development","Personal development"]]},
      {title:"Level", type:"checkbox", key:"levels", values:[["beginner","Beginner"],["intermediate","Intermediate"],["advanced","Advanced"],["all-levels","All levels"]]},
      {title:"Price", type:"checkbox", key:"prices", values:[["free","Free"],["under-200","Under 200,000₫"],["200-500","200,000₫–500,000₫"],["500-plus","500,000₫+"]]}
    ];

    const state = {query:"",format:"all",topics:new Set(),levels:new Set(),prices:new Set(),view:"grid"};
    const cardsEl = document.getElementById("cards");
    const activeRow = document.getElementById("activeRow");
    const activeList = document.getElementById("activeList");

    function moneyBucket(value) {
      if (value === 0) return "free";
      if (value < 200000) return "under-200";
      if (value <= 500000) return "200-500";
      return "500-plus";
    }

    function filterMarkup(prefix) {
      return `<div class="${prefix === 'desktop' ? '' : 'mobile-filter-content'}">${prefix === 'desktop' ? `<div class="filters-head"><span class="filters-title">Filters</span><button class="clear-button" data-clear type="button">Clear all</button></div>` : ''}${config.map(group => `
        <section class="filter-group">
          <h3>${group.title}</h3>
          <div class="options">
            ${group.values.map(([value,label]) => `<label class="option"><span>${label}</span><input data-filter-key="${group.key}" value="${value}" type="${group.type}" ${group.type === 'radio' ? `name="${prefix}-format"` : ''}></label>`).join('')}
          </div>
        </section>`).join('')}</div>`;
    }

    document.getElementById("desktopFilters").innerHTML = filterMarkup("desktop");
    document.getElementById("mobileFilters").innerHTML = filterMarkup("mobile");

    const eventSummaries = {
      1: "Make Pizza 4P’s-style dough, shape your own pizza, and learn practical baking techniques in a guided small-group session.",
      2: "Learn hand-building basics, shape a functional clay piece, and prepare it for glazing and studio firing.",
      3: "Practice IELTS speaking prompts with timed rounds, peer feedback, and guidance from an experienced facilitator.",
      4: "Meet local founders and operators through structured introductions, focused discussions, and open networking.",
      5: "Explore color mixing and loose watercolor techniques while completing a guided painting from home.",
      6: "Photograph the Old Quarter at its quietest and receive practical composition and street-photography guidance.",
      7: "Start the morning with an accessible outdoor yoga flow focused on mobility, breathing, and calm movement."
    };

    function cardMarkup(event) {
      const onlineIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="3"></rect><path d="m10 9 5 3-5 3V9Z"></path></svg>`;
      const pinIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>`;
      return `<a class="card-link" href="/events/${event.slug}" target="_top" aria-label="View details for ${event.title}"><article class="card" data-id="${event.id}" style="--gradient:${event.gradient}">
        <div class="media">
          <img class="media-image" src="${event.image}" alt="${event.title}" loading="${event.id <= 3 ? "eager" : "lazy"}" decoding="async" />
          <span class="format-badge">${event.format}</span>
          <span class="save" role="button" tabindex="0" aria-label="Save ${event.title}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5S4 16 4 9.5A4.5 4.5 0 0 1 12 6a4.5 4.5 0 0 1 8 3.5c0 6.5-8 11-8 11Z"></path></svg></span>
          <span class="date-badge"><small>${event.date}</small><strong>${event.time}</strong></span>
          <span class="spots">${event.spots}</span>
        </div>
        <div class="card-body">
          <div class="eyebrow-row"><span class="topic">${event.topic}</span><span class="price">${event.priceLabel}</span></div>
          <div>
            <h2>${event.title}</h2>
            <p class="host">Hosted by ${event.host}<span class="grid-level"> · ${event.level}</span></p>
            <p class="summary">${eventSummaries[event.id]}</p>
            <div class="detail-grid">
              <div class="detail-item"><small>Date</small><strong>${event.date}</strong></div>
              <div class="detail-item"><small>Time</small><strong>${event.time}</strong></div>
              <div class="detail-item"><small>Location</small><strong>${event.location}</strong></div>
              <div class="detail-item"><small>Level</small><strong>${event.level}</strong></div>
            </div>
          </div>
          <aside class="list-actions">
            <div>
              <span class="list-price-label">Price</span>
              <span class="list-price">${event.priceLabel}</span>
              <span class="list-spots">${event.spots}<br>${event.format}</span>
            </div>
            <span class="details-button">View details</span>
          </aside>
          <div class="location">${event.formatKey === 'online' ? onlineIcon : pinIcon}<span>${event.location}</span></div>
        </div>
      </article></a>`;
    }

    function syncInputs() {
      document.querySelectorAll("[data-filter-key]").forEach(input => {
        const key = input.dataset.filterKey;
        if (key === "format") input.checked = state.format === input.value;
        if (key === "topics") input.checked = state.topics.has(input.value);
        if (key === "levels") input.checked = state.levels.has(input.value);
        if (key === "prices") input.checked = state.prices.has(input.value);
      });
    }

    function activeItems() {
      const items = [];
      const labelMap = Object.fromEntries(config.flatMap(group => group.values));
      if (state.format !== "all") items.push(["format", state.format, labelMap[state.format]]);
      state.topics.forEach(value => items.push(["topics", value, labelMap[value]]));
      state.levels.forEach(value => items.push(["levels", value, labelMap[value]]));
      state.prices.forEach(value => items.push(["prices", value, labelMap[value]]));
      return items;
    }

    function renderActive() {
      const items = activeItems();
      activeRow.hidden = items.length === 0;
      activeList.innerHTML = items.map(([key,value,label]) => `<button class="active-chip" data-remove-key="${key}" data-remove-value="${value}" type="button"><span>${label}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 7 10 10M17 7 7 17"></path></svg></button>`).join("");
      activeList.querySelectorAll("[data-remove-key]").forEach(button => button.addEventListener("click", () => {
        const key = button.dataset.removeKey;
        const value = button.dataset.removeValue;
        if (key === "format") state.format = "all"; else state[key].delete(value);
        syncInputs();
        render();
      }));
      document.getElementById("filterCount").textContent = items.length ? `(${items.length})` : "";
    }

    function sortedEvents(list) {
      const mode = document.getElementById("sort").value;
      const copy = [...list];
      if (mode === "price") copy.sort((a,b) => a.price - b.price);
      else if (mode === "popular") copy.sort((a,b) => b.popularity - a.popularity);
      else if (mode === "newest") copy.sort((a,b) => b.order - a.order);
      else copy.sort((a,b) => a.order - b.order);
      return copy;
    }

    function render() {
      const query = state.query.toLowerCase();
      const filtered = events.filter(event => {
        const searchable = `${event.title} ${event.host} ${event.topic} ${event.level} ${event.location}`.toLowerCase();
        return (!query || searchable.includes(query)) &&
          (state.format === "all" || event.formatKey === state.format) &&
          (!state.topics.size || state.topics.has(event.topicKey)) &&
          (!state.levels.size || state.levels.has(event.levelKey)) &&
          (!state.prices.size || state.prices.has(moneyBucket(event.price)));
      });
      const ordered = sortedEvents(filtered);
      cardsEl.innerHTML = ordered.map(cardMarkup).join("");
      cardsEl.classList.toggle("list", state.view === "list");
      document.getElementById("empty").classList.toggle("show", filtered.length === 0);
      renderActive();
    }

    function clearFilters() {
      state.query = "";
      state.format = "all";
      state.topics.clear();
      state.levels.clear();
      state.prices.clear();
      document.getElementById("search").value = "";
      syncInputs();
      render();
    }

    document.addEventListener("change", event => {
      const input = event.target.closest("[data-filter-key]");
      if (!input) return;
      const key = input.dataset.filterKey;
      if (key === "format") state.format = input.value;
      else if (input.checked) state[key].add(input.value);
      else state[key].delete(input.value);
      syncInputs();
      render();
    });

    document.addEventListener("click", event => {
      if (event.target.closest(".save")) {
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      if (event.target.closest("[data-clear]")) clearFilters();
    });

    document.addEventListener("keydown", event => {
      const save = event.target.closest?.(".save");
      if (!save || (event.key !== "Enter" && event.key !== " ")) return;
      event.preventDefault();
      event.stopPropagation();
    });

    document.getElementById("search").addEventListener("input", event => { state.query = event.target.value.trim(); render(); });
    document.getElementById("sort").addEventListener("change", render);
    document.getElementById("clearActive").addEventListener("click", clearFilters);
    document.getElementById("emptyClear").addEventListener("click", clearFilters);
    document.getElementById("mobileClear").addEventListener("click", clearFilters);

    document.getElementById("gridView").addEventListener("click", () => {
      state.view = "grid";
      document.getElementById("gridView").classList.add("active");
      document.getElementById("listView").classList.remove("active");
      render();
    });
    document.getElementById("listView").addEventListener("click", () => {
      state.view = "list";
      document.getElementById("listView").classList.add("active");
      document.getElementById("gridView").classList.remove("active");
      render();
    });

    const drawer = document.getElementById("drawer");
    function openDrawer() { drawer.classList.add("open"); drawer.setAttribute("aria-hidden","false"); }
    function closeDrawer() { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); }
    document.getElementById("mobileFilterButton").addEventListener("click", openDrawer);
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    document.getElementById("backdrop").addEventListener("click", closeDrawer);
    document.getElementById("mobileApply").addEventListener("click", closeDrawer);

    syncInputs();
    render();

    let lastPostedY = -1;
    function postScrollPosition() {
      const y = Math.max(window.scrollY, document.documentElement.scrollTop, document.body.scrollTop);
      if (Math.abs(y - lastPostedY) < 2) return;
      lastPostedY = y;
      window.parent?.postMessage({ type: "tutoria-events-scroll", y }, window.location.origin);
    }
    window.addEventListener("scroll", postScrollPosition, { passive: true });
    postScrollPosition();
  </script>
</body>
</html>
