      </section>
      <section>
        <h2 class="udemy-coupon-section-title" style="margin-top:0">Coupons</h2>
        <div class="udemy-promo-block">
          <div class="udemy-coupon-month"><div><strong>${month} coupons</strong><p>You can create ${remaining} more coupon${remaining===1?'':'s'} this month.</p></div><button class="btn btn-primary" data-add-coupon ${remaining===0?'disabled':''}>Create new coupon</button></div>
        </div>
        <h2 class="udemy-coupon-section-title">Active coupons</h2>
        ${state.coupons.length?`<div class="udemy-coupon-table"><div class="udemy-coupon-row udemy-coupon-head"><span>Code</span><span>Discount</span><span>Time remaining</span><span>Redemptions</span><span>Link</span><span>Status</span></div>${rows}</div>`:`<div class="udemy-coupon-table"><div class="udemy-coupon-empty"><i data-lucide="ticket" class="icon"></i><strong>No active coupons</strong><span>Create a coupon to promote this course.</span></div></div>`}
      </section>`;
  };
  function mergedInfoModal(title,body){
    modalRoot.innerHTML=`<div class="modal"><div class="modal-card" style="max-width:620px"><div class="modal-head"><strong>${esc(title)}</strong><button class="icon-btn" data-close-modal><i data-lucide="x" class="icon"></i></button></div><div class="modal-body"><p style="margin:0;color:#aaaab0;line-height:1.7">${body}</p></div><div class="modal-footer"><button class="btn btn-primary" data-close-modal>Done</button></div></div></div>`;
    document.querySelectorAll('[data-close-modal]').forEach(button=>button.onclick=closeModal);lucide.createIcons();
  }
  function mergedCouponModal(){
    if(mergedCouponRemaining()===0)return showToast('You have used all three coupon slots for this month');
    const tiers=MERGED_PRICE_TIERS[state.priceCurrency]||MERGED_PRICE_TIERS.VND;
    const expires=new Date(Date.now()+5*86400000);expires.setHours(23,59,0,0);
    modalRoot.innerHTML=`<div class="modal"><div class="modal-card" style="max-width:760px"><div class="modal-head"><div><strong>Create new coupon</strong><div class="help">Coupon codes are saved locally in this prototype.</div></div><button class="icon-btn" data-close-modal><i data-lucide="x" class="icon"></i></button></div><div class="modal-body stack">
      <label><span class="label">Coupon type</span><select id="mergedCouponType" class="field"><option value="best_price">Current best price</option><option value="custom_price">Custom price</option><option value="free_open">Free: Open</option><option value="free_targeted">Free: Targeted</option></select></label>
      <div class="udemy-coupon-form-grid"><label><span class="label">Coupon code</span><input id="mergedCouponCode" class="field" maxlength="20" placeholder="LAUNCH2026"></label><label data-custom-price-wrap class="hidden"><span class="label">Custom price</span><select id="mergedCouponPrice" class="field">${tiers.map(tier=>`<option value="${tier}">${mergedPriceLabel(tier,state.priceCurrency)}</option>`).join('')}</select></label><label><span class="label">Expiration</span><input id="mergedCouponExpiry" type="datetime-local" class="field" value="${expires.toISOString().slice(0,16)}"></label><label><span class="label">Redemption limit</span><input id="mergedCouponLimit" type="number" min="1" max="100000" class="field" value="1000"></label></div>
      <div id="mergedCouponHelp" class="udemy-coupon-help"></div><div id="mergedCouponError"></div>
    </div><div class="modal-footer"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-create-merged-coupon>Create coupon</button></div></div></div>`;
    const type=document.getElementById('mergedCouponType'),priceWrap=document.querySelector('[data-custom-price-wrap]'),expiry=document.getElementById('mergedCouponExpiry'),limit=document.getElementById('mergedCouponLimit'),help=document.getElementById('mergedCouponHelp');
    const refresh=()=>{
      const key=type.value;priceWrap.classList.toggle('hidden',key!=='custom_price');
      if(key==='best_price'){help.textContent='Offers the current best marketplace price. Recommended for broad promotions.';limit.value='1000'}
      if(key==='custom_price'){help.textContent='Choose a specific price tier below your list price.';limit.value='1000'}
      if(key==='free_open'){help.textContent='A short free coupon intended for broad sharing.';limit.value='1000'}
      if(key==='free_targeted'){help.textContent='A longer free coupon intended for a limited audience.';limit.value='100'}
      const days=key==='free_open'?3:key==='free_targeted'||key==='custom_price'?31:5;const next=new Date(Date.now()+days*86400000);next.setHours(23,59,0,0);expiry.value=next.toISOString().slice(0,16);
    };
    type.onchange=refresh;refresh();
    document.querySelector('[data-create-merged-coupon]').onclick=()=>{
      const code=document.getElementById('mergedCouponCode').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');
      const error=document.getElementById('mergedCouponError');error.innerHTML='';
      if(code.length<3)return error.innerHTML='<div class="danger info">Use at least three letters or numbers.</div>';
      if(state.coupons.some(coupon=>coupon.code===code))return error.innerHTML='<div class="danger info">That coupon code already exists.</div>';
      const expiresAt=document.getElementById('mergedCouponExpiry').value;
      if(!expiresAt)return error.innerHTML='<div class="danger info">Choose an expiration date.</div>';
      const coupon={id:id(),code,typeKey:type.value,type:mergedCouponTypeLabel(type.value),price:type.value==='custom_price'?document.getElementById('mergedCouponPrice').value:'',currency:state.priceCurrency,expiresAt:new Date(expiresAt).toISOString(),limit:Math.max(1,Number(document.getElementById('mergedCouponLimit').value)||1000),used:0,active:true,createdMonth:mergedMonthKey(),createdAt:new Date().toISOString()};
      state.coupons.push(coupon);persist();closeModal();render();showToast('Coupon created');
    };
    document.querySelectorAll('[data-close-modal]').forEach(button=>button.onclick=closeModal);lucide.createIcons();
  }
  function mergedShareCouponModal(couponId){
    const coupon=state.coupons.find(value=>value.id===couponId);if(!coupon)return;
    const link=mergedCouponLink(coupon);
    modalRoot.innerHTML=`<div class="modal"><div class="modal-card" style="max-width:650px"><div class="modal-head"><div><strong>Share ${esc(coupon.code)}</strong><div class="help">${esc(mergedCouponOffer(coupon))} · ${esc(mergedCouponExpiryLabel(coupon))}</div></div><button class="icon-btn" data-close-modal><i data-lucide="x" class="icon"></i></button></div><div class="modal-body"><div class="udemy-modal-copy-row"><input id="mergedCouponLink" class="field" readonly value="${esc(link)}"><button class="btn btn-primary" data-copy-coupon-link>Copy link</button></div></div></div></div>`;
    document.querySelector('[data-copy-coupon-link]').onclick=async()=>{try{await navigator.clipboard.writeText(link);showToast('Coupon link copied')}catch{showToast('Copy failed')}};
    document.querySelector('[data-close-modal]').onclick=closeModal;lucide.createIcons();
  }
  const mergedOriginalBindPageActions=bindPageActions;
  bindPageActions=function(){
    mergedOriginalBindPageActions();
    const currency=document.querySelector('[data-price-currency]');
    if(currency)currency.onchange=event=>{state.priceCurrency=event.target.value;autosave();render()};
    const tier=document.querySelector('[data-price-tier]');if(tier)tier.onchange=event=>{state.priceTier=event.target.value;autosave()};
    const savePricing=document.querySelector('[data-save-pricing]');if(savePricing)savePricing.onclick=()=>{persist();render();showToast('Pricing saved')};
    const priceHelp=document.querySelector('[data-price-help]');if(priceHelp)priceHelp.onclick=()=>mergedInfoModal('When this price is shown','Your selected tier is the course list price. If marketplace deals are enabled, learners can see a promotional deal price instead; the list price remains the reference price when a deal is unavailable.');
    const promoLearn=document.querySelector('[data-promo-learn]');if(promoLearn)promoLearn.onclick=()=>mergedInfoModal('Instructor referral links','Sales completed through your referral link are attributed to your own promotion. Coupon links combine that attribution with the coupon offer.');
    const copy=document.querySelector('[data-copy-link]');if(copy)copy.onclick=async()=>{const value=copy.previousElementSibling?.value||'';try{await navigator.clipboard.writeText(value);showToast('Referral link copied')}catch{showToast('Copy failed')}};
    const addCoupon=document.querySelector('[data-add-coupon]');if(addCoupon)addCoupon.onclick=mergedCouponModal;
    document.querySelectorAll('[data-share-coupon]').forEach(button=>button.onclick=()=>mergedShareCouponModal(button.dataset.shareCoupon));
    document.querySelectorAll('[data-toggle-coupon]').forEach(input=>input.onchange=event=>{const coupon=state.coupons.find(value=>value.id===event.target.dataset.toggleCoupon);if(!coupon)return;coupon.active=event.target.checked;persist();render();showToast(coupon.active?'Coupon activated':'Coupon deactivated')});
  };
  mergedNormalizePricingState();

  render();
})();
</script>
</body>
</html>
