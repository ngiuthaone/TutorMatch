    /* ─────────────────────────────────────────────────────────────
       TUTORIA CREATOR — PREMIUM CHARCOAL DESIGN SYSTEM
       Visual override only. Existing interactions and data flow stay intact.
    ───────────────────────────────────────────────────────────── */
    :root{
      --ink:#17181a;
      --muted:#73777d;
      --line:#d9dadd;
      --soft:#eef0f2;
      --panel:#fafafa;
      --purple:#1b1d20;
      --purple-dark:#050607;
      --purple-soft:#e9eaec;
      --nav:#111214;
      --ok:#2f7557;
      --warn:#9a6425;
      --danger:#a44738;
      --shadow:0 1px 2px rgba(9,10,12,.04),0 12px 34px rgba(9,10,12,.07);
      --shadow-lg:0 1px 2px rgba(9,10,12,.05),0 28px 70px rgba(9,10,12,.14);
      --radius-sm:10px;
      --radius:16px;
      --radius-lg:24px;
    }

    html{background:#e9ebed}
    body{
      font-family:"Instrument Sans","SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--ink);
      background:#e9ebed;
      font-size:14px;
      font-weight:500;
      letter-spacing:-.012em;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button,input,textarea,select{font-family:inherit}
    ::selection{background:#25272b;color:#fff}
    *{scrollbar-width:thin;scrollbar-color:#aaadb2 transparent}
    *::-webkit-scrollbar{width:8px;height:8px}
    *::-webkit-scrollbar-thumb{background:#aaadb2;border-radius:999px;border:2px solid transparent;background-clip:padding-box}
    *::-webkit-scrollbar-track{background:transparent}

    .icon{width:17px;height:17px;stroke-width:1.8}
    .brand{
      font-size:21px;
      line-height:1;
      font-weight:700;
      letter-spacing:-.065em;
      text-transform:lowercase;
    }
    .brand::after{content:"·";margin-left:2px;color:#8e9298}

    .btn{
      min-height:42px;
      padding:0 16px;
      border:1px solid #cfd1d4;
      border-radius:12px;
      background:rgba(255,255,255,.78);
      color:#202226;
      font-size:13px;
      font-weight:700;
      letter-spacing:-.02em;
      box-shadow:0 1px 1px rgba(0,0,0,.025);
      transition:background .18s ease,border-color .18s ease,box-shadow .18s ease,transform .18s ease,color .18s ease;
    }
    .btn:hover{background:#fff;border-color:#b9bcc1;box-shadow:0 6px 18px rgba(11,12,14,.07);transform:translateY(-1px)}
    .btn:active{transform:translateY(0);box-shadow:none}
    .btn-primary{background:#17181a;border-color:#17181a;color:#fff;box-shadow:0 8px 22px rgba(8,9,10,.16)}
    .btn-primary:hover{background:#050607;border-color:#050607;box-shadow:0 12px 28px rgba(8,9,10,.22)}
    .btn-ghost{background:transparent;border-color:transparent;box-shadow:none}
    .btn-ghost:hover{background:rgba(25,27,30,.06);border-color:transparent;box-shadow:none}
    .btn-danger{color:var(--danger);border-color:rgba(164,71,56,.35);background:#fff8f6}
    .btn-sm{min-height:36px;padding:0 13px;font-size:12px;border-radius:10px}
    .btn:disabled{opacity:.32;transform:none;box-shadow:none}

    .field{
      min-height:48px;
      border:1px solid #cfd1d4;
      border-radius:12px;
      background:rgba(255,255,255,.9);
      color:#17181a;
      padding:12px 14px;
      font-size:14px;
      font-weight:550;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 1px rgba(0,0,0,.02);
      transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
    }
    .field:hover{border-color:#b8bbc0;background:#fff}
    .field:focus{border-color:#17181a;background:#fff;box-shadow:0 0 0 4px rgba(23,24,26,.08)}
    textarea.field{min-height:126px;line-height:1.62}
    select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#60646a 50%),linear-gradient(135deg,#60646a 50%,transparent 50%);background-position:calc(100% - 18px) 21px,calc(100% - 13px) 21px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
    input[type="checkbox"],input[type="radio"]{accent-color:#17181a}
    .label{font-size:13px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
    .help{font-size:12px;line-height:1.55;color:#7b7f85}
    .count{font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:10.5px;color:#888c92;letter-spacing:-.03em}

    /* Instrument typography tuning — expressive, precise, and product-led */
    body{
      font-family:"Instrument Sans","SF Pro Text","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-feature-settings:"ss01" 1,"ss02" 1,"cv02" 1,"cv05" 1,"cv11" 1;
      letter-spacing:-.008em;
    }
    .brand,.wizard-title,.page-title,.preview-title,.preview-box h3,.side-summary h2,.section-title,.choice-title{
      font-family:"Instrument Sans","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      font-feature-settings:"ss01" 1,"ss02" 1,"cv02" 1,"cv05" 1,"cv11" 1;
    }
    .brand{font-weight:700;letter-spacing:-.072em}
    .wizard-title{font-weight:640;letter-spacing:-.052em}
    .page-title{font-weight:650;letter-spacing:-.052em}
    .section-title{font-weight:650;letter-spacing:-.035em}
    .choice-title{font-weight:650;letter-spacing:-.03em}
    .topbar-title,.nav-item,.label,.btn,.field{font-feature-settings:"ss01" 1,"ss02" 1,"cv02" 1,"cv05" 1,"cv11" 1}
    .count,.wizard-eyebrow,.page-kicker,.section-label,.topbar-status,.side-summary p,.nav-group-title,.list-number,.metric span,.item-meta,.published-pill,.draft-pill,.save-state{
      font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      font-feature-settings:"zero" 1;
      letter-spacing:.035em;
    }

    /* Setup wizard */
    .wizard-shell{background:#eceeef;min-height:100vh;position:relative;overflow:hidden}
    .wizard-shell::before{content:"";position:fixed;inset:-25%;pointer-events:none;background:radial-gradient(circle at 50% 12%,rgba(255,255,255,.96),rgba(255,255,255,0) 38%),radial-gradient(circle at 15% 90%,rgba(255,255,255,.5),transparent 30%)}
    .wizard-top{height:76px;padding:0 34px;border-bottom:1px solid rgba(26,28,31,.1);background:rgba(239,241,243,.78);backdrop-filter:blur(24px);position:relative;z-index:2}
    .wizard-progress{height:2px;background:rgba(30,32,35,.09);position:relative;z-index:2}
    .wizard-progress>span{background:#191a1c}
    .wizard-main{min-height:calc(100vh - 152px);padding:54px 24px 72px;position:relative;z-index:1}
    .wizard-card{width:min(880px,100%)}
    .wizard-eyebrow,.page-kicker,.section-label{
      font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:10px;
      font-weight:600;
      color:#82868c;
    }
    .wizard-title{
      font-family:"Instrument Sans","SF Pro Display",sans-serif;
      font-size:clamp(34px,4vw,52px);
      line-height:1.08;
      letter-spacing:-.055em;
      font-weight:680;
      max-width:800px;
      margin:0 auto 18px;
    }
    .wizard-sub{font-size:15px;line-height:1.68;color:#70747a;max-width:620px;margin-bottom:38px}
    .choice-grid{gap:16px}
    .choice-card{
      min-height:172px;
      border:1px solid rgba(28,30,33,.12);
      border-radius:22px;
      padding:26px;
      background:rgba(255,255,255,.68);
      backdrop-filter:blur(16px);
      box-shadow:0 1px 0 rgba(255,255,255,.8) inset;
      overflow:hidden;
    }
    .choice-card::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-62px;bottom:-65px;background:radial-gradient(circle,rgba(20,22,25,.08),transparent 68%);opacity:0;transition:.25s}
    .choice-card:hover{border-color:#aeb1b6;box-shadow:var(--shadow);transform:translateY(-2px)}
    .choice-card:hover::after{opacity:1}
    .choice-card.selected{border:1px solid #1a1c1f;background:#191a1d;color:#fff;box-shadow:0 22px 45px rgba(10,11,12,.19)}
    .choice-card.selected .choice-text{color:#b7bbc0}
    .choice-card.selected .icon{color:#fff}
    .choice-title{font-size:17px;font-weight:700;letter-spacing:-.035em;margin-top:20px}
    .choice-text{font-size:13px;color:#74787e;line-height:1.62}
    .wizard-field{max-width:680px;padding:26px;border-radius:20px;background:rgba(255,255,255,.7);border:1px solid rgba(28,30,33,.11);box-shadow:0 18px 50px rgba(25,27,30,.06);backdrop-filter:blur(20px)}
    .time-grid{max-width:680px;gap:12px}
    .time-option{border:1px solid rgba(27,29,32,.13);border-radius:15px;padding:20px 22px;background:rgba(255,255,255,.7);font-size:13px;transition:.18s ease}
    .time-option:hover{background:#fff;border-color:#afb2b7;transform:translateY(-1px)}
    .time-option.selected{border:1px solid #17181a;background:#17181a;color:#fff;box-shadow:0 12px 28px rgba(11,12,14,.16)}
    .wizard-footer{height:74px;padding:0 34px;border-top:1px solid rgba(27,29,32,.1);background:rgba(239,241,243,.82);backdrop-filter:blur(24px);z-index:3}

    /* Creator workspace */
    .manage-shell{background:#e9ebed;min-height:100vh}
    .topbar{
      height:70px;
      padding:0 20px;
      background:rgba(16,17,19,.97);
      border-bottom:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(24px);
      box-shadow:0 1px 0 rgba(255,255,255,.025) inset;
    }
    .topbar-left,.topbar-right{gap:10px}
    .topbar-title{font-size:13px;font-weight:700;letter-spacing:-.025em;max-width:430px}
    .topbar-status{font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:#888d94;margin-top:3px}
    .topbar .btn{min-height:36px;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.055);color:#eff0f2;box-shadow:none}
    .topbar .btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);transform:none}
    .topbar .btn-primary{background:#f2f3f4;color:#17181a;border-color:#f2f3f4}
    .manage-grid{grid-template-columns:286px minmax(0,1fr);min-height:calc(100vh - 70px)}
    .sidebar{
      top:70px;
      height:calc(100vh - 70px);
      padding:20px 14px 28px;
      border-right:1px solid rgba(255,255,255,.055);
      background:#141517;
      color:#d6d8dc;
    }
    .side-summary{padding:10px 12px 22px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:22px}
    .side-summary h2{font-family:"Instrument Sans",sans-serif;font-size:17px;font-weight:700;letter-spacing:-.045em;color:#f2f3f4;margin-bottom:7px}
    .side-summary p{font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:#777c83}
    .nav-group{margin-bottom:22px}
    .nav-group-title{padding:0 12px 8px;color:#686d74;font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.12em}
    .nav-item{
      min-height:42px;
      margin:2px 0;
      padding:8px 10px;
      border-radius:11px;
      color:#9da1a8;
      font-size:12.5px;
      font-weight:560;
      transition:.16s ease;
    }
    .nav-item:hover{background:rgba(255,255,255,.055);color:#e9eaec}
    .nav-item.active{background:rgba(255,255,255,.105);color:#fff;font-weight:680;border-left:0;padding-left:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
    .nav-check{width:17px;height:17px;border-color:#545960;background:transparent;color:#fff;font-size:9px}
    .nav-item.done .nav-check{background:#edf0f2;border-color:#edf0f2;color:#161719}
    .nav-item.optional .nav-check{border-color:#4e535a}

    .main{
      min-width:0;
      background:
        radial-gradient(circle at 85% -10%,rgba(255,255,255,.9),transparent 36%),
        linear-gradient(180deg,#eff1f2 0,#e9ebed 360px);
    }
    .page-wrap{max-width:1120px;padding:48px 54px 128px}
    .page-header{padding-bottom:30px;margin-bottom:34px;border-bottom:1px solid rgba(28,30,33,.11)}
    .page-header-row{align-items:center}
    .page-title{
      font-family:"Instrument Sans","SF Pro Display",sans-serif;
      font-size:clamp(30px,3vw,42px);

      letter-spacing:-.055em;
      font-weight:690;

    .page-desc{max-width:720px;font-size:14px;line-height:1.7;color:#6f7379;font-weight:500}
    .section{margin-bottom:38px}
    .section-title{font-size:17px;line-height:1.3;font-weight:700;letter-spacing:-.035em;margin-bottom:8px}
    .section-desc{font-size:12.5px;line-height:1.65;color:#777b81;margin-bottom:17px}
    .stack>*+*{margin-top:13px}

    .panel,.metric,.check-card,.radio-card,.resource-row,.question-card{
      border:1px solid rgba(26,28,31,.11);
      border-radius:16px;
      background:rgba(250,250,250,.86);
      box-shadow:0 1px 0 rgba(255,255,255,.75) inset,0 5px 18px rgba(15,16,18,.035);
    }
    .panel{padding:22px}
    .panel-soft{background:rgba(244,245,246,.82)}
    .info{
      gap:13px;
      border:1px solid rgba(27,29,32,.12);
      border-radius:15px;
      background:rgba(248,249,250,.78);
      padding:17px 18px;
      backdrop-filter:blur(12px);
    }
    .warning{border-color:rgba(154,100,37,.24);background:#fbf7f0}
    .danger{border-color:rgba(164,71,56,.22);background:#fbf4f2}
    .success{border-color:rgba(47,117,87,.22);background:#f2f8f5}
    .grid-2{gap:16px}.grid-3{gap:14px}
    .list-field{grid-template-columns:26px minmax(0,1fr) 38px;gap:10px}
    .list-number{font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:10px;color:#8c9096}
    .icon-btn{width:36px;height:36px;border-radius:10px;color:#686c72;transition:.15s ease}
    .icon-btn:hover{background:rgba(24,26,29,.07);color:#17181a}
    .check-card{padding:17px;transition:.16s ease}
    .check-card:hover{border-color:#babdc1;background:#fff}
    .check-card input{width:16px;height:16px}
    .metric-grid{gap:12px}
    .metric{padding:17px 18px;background:rgba(249,249,250,.82)}
    .metric strong{font-size:25px;line-height:1;font-weight:660;letter-spacing:-.055em}
    .metric span{display:block;margin-top:9px;font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#868a90}

    /* Curriculum */
    .curriculum-toolbar{margin-bottom:20px}
    .curriculum-layout{grid-template-columns:minmax(0,1fr) 402px;gap:18px}
    .section-card{border:1px solid rgba(25,27,30,.13);border-radius:18px;background:rgba(250,250,250,.88);margin-bottom:14px;overflow:hidden;box-shadow:0 12px 32px rgba(15,16,18,.045)}
    .section-head{background:linear-gradient(180deg,#f7f8f9,#f2f3f4);border-bottom:1px solid rgba(25,27,30,.1);padding:16px 17px}
    .section-name{font-size:14px;font-weight:700;letter-spacing:-.025em}
    .section-goal{font-size:11.5px;color:#7c8086;line-height:1.5}
    .item-row{grid-template-columns:26px minmax(0,1fr) auto;gap:10px;padding:13px 15px;border-bottom:1px solid rgba(26,28,31,.08);background:rgba(255,255,255,.48)}
    .item-row:hover{background:rgba(255,255,255,.9)}
    .item-row.selected{background:#e4e6e8;box-shadow:inset 3px 0 0 #1b1d20}
    .item-title{font-size:12.5px;font-weight:700;letter-spacing:-.02em}
    .item-meta{font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:9px;letter-spacing:.01em;color:#898d93;margin-top:4px}
    .add-item-bar{padding:13px 14px;background:#f4f5f6;border-top:0;gap:7px}
    .add-item-bar .btn{background:#fafafa;min-height:34px}
    .editor{top:92px;border:1px solid rgba(24,26,29,.14);border-radius:18px;background:rgba(250,250,250,.94);box-shadow:0 24px 60px rgba(13,14,16,.1);overflow:hidden}
    .editor-head{padding:17px 18px;border-bottom:1px solid rgba(25,27,30,.1);background:linear-gradient(180deg,#f7f8f9,#f1f2f3)}
    .editor-body{padding:18px}
    .editor-tabs{border-bottom:1px solid rgba(25,27,30,.1);padding:0 8px;background:#f6f7f8}
    .editor-tab{padding:13px 12px;background:transparent;color:#7d8187;font-size:11px;border-radius:0}
    .editor-tab.active{color:#17181a;box-shadow:inset 0 -2px 0 #17181a}
    .file-drop{border:1px dashed #aeb2b7;border-radius:15px;background:#f1f2f3;padding:25px}
    .resource-row,.question-card{padding:15px}
    .answer-row{grid-template-columns:18px minmax(0,1fr) 34px}
    .published-pill,.draft-pill{font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;padding:5px 7px}
    .published-pill{background:#e4eee9;color:#276549}
    .draft-pill{background:#e8eaec;color:#757a80}

    /* Media and content cards */
    .upload-card{border:1px solid rgba(25,27,30,.12);border-radius:18px;overflow:hidden;background:rgba(250,250,250,.88);min-height:176px;box-shadow:0 10px 26px rgba(15,16,18,.045)}
    .upload-preview{background:linear-gradient(145deg,#e3e5e7,#f1f2f3);border-color:rgba(25,27,30,.1)}
    .upload-content{padding:18px}
    .tag{border:1px solid #d0d2d5;border-radius:999px;background:#f2f3f4;padding:7px 10px;font-size:11px}
    .radio-card{padding:19px;transition:.16s ease}
    .radio-card:hover{border-color:#b4b7bc;background:#fff}
    .radio-card:has(input:checked){border:1px solid #191a1d;background:#191a1d;color:#fff;box-shadow:0 15px 35px rgba(11,12,14,.16)}
    .radio-card:has(input:checked) .help{color:#aeb2b8}
    .review-row{padding:15px 0;border-color:rgba(25,27,30,.09)}
    .review-icon{background:#e4e6e8;color:#6f747b}
    .review-row.done .review-icon{background:#1b1d20;color:#fff}


    .faq-edit-card{
      border:1px solid rgba(25,27,30,.12);
      border-radius:18px;
      background:rgba(250,250,250,.88);
      padding:20px;
      box-shadow:0 12px 34px rgba(15,16,18,.045);
    }
    .faq-edit-card+.faq-edit-card{margin-top:14px}
    .faq-index{
      width:30px;height:30px;border-radius:10px;
      background:#1a1b1e;color:#fff;
      font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;
      font-size:10px;font-weight:600;
      box-shadow:0 6px 16px rgba(10,11,12,.14);
    }
    .faq-preview-item{border-color:rgba(25,27,30,.11)}
    .faq-preview-item summary{padding:18px 2px;font-size:13px;font-weight:700;letter-spacing:-.02em}
    .faq-preview-item summary:after{color:#777b81;font-family:"Instrument Sans",sans-serif}
    .faq-preview-answer{padding:0 34px 20px 2px;color:#71757b;font-size:12.5px;line-height:1.72}

    /* Footer */
    .page-footer{left:286px;background:rgba(237,239,241,.84);border-top:1px solid rgba(25,27,30,.11);backdrop-filter:blur(24px)}
    .page-footer-inner{max-width:1120px;padding:13px 54px}
    .save-state{font-family:"DM Mono",ui-monospace,SFMono-Regular,monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:#81858b}

    /* Modals and toast */
    .modal{background:rgba(10,11,12,.72);backdrop-filter:blur(10px)}
    .modal-card{border-radius:22px;overflow:auto;background:#eff1f2;box-shadow:var(--shadow-lg);border:1px solid rgba(255,255,255,.14)}
    .modal-head{padding:15px 18px;background:rgba(246,247,248,.9);border-bottom:1px solid rgba(25,27,30,.1);backdrop-filter:blur(20px)}
    .toast{bottom:92px;border-radius:12px;background:#151618;padding:12px 16px;box-shadow:0 18px 40px rgba(8,9,10,.24);font-size:11px;letter-spacing:-.01em}

    /* Learner preview */
    .preview-hero{background:linear-gradient(145deg,#111214 0%,#212328 100%);padding:52px 42px 48px;position:relative;overflow:hidden}
    .preview-hero::before{content:"";position:absolute;inset:-50% -20%;background:radial-gradient(circle at 72% 28%,rgba(255,255,255,.09),transparent 26%);pointer-events:none}
    .preview-grid{max-width:1160px;grid-template-columns:minmax(0,1fr) 354px;gap:46px;position:relative}
    .preview-title{font-family:"Instrument Sans","SF Pro Display",sans-serif;font-size:clamp(34px,4vw,48px);line-height:1.08;font-weight:680;letter-spacing:-.055em;margin:12px 0 14px}
    .preview-sub{font-size:15px;line-height:1.65;color:#b5b9bf}
    .preview-buy{border-radius:20px;overflow:hidden;background:#f7f8f9;color:#17181a;box-shadow:0 30px 70px rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.14)}
    .preview-image{background:linear-gradient(145deg,#dfe1e3,#eceeef)}
    .preview-buy-body{padding:21px}
    .preview-body{max-width:1160px;padding:56px 408px 70px 0}
    .preview-box{border:1px solid rgba(25,27,30,.12);border-radius:20px;padding:25px;background:#fafafa;box-shadow:0 14px 40px rgba(15,16,18,.045)}
    .preview-box h3{font-family:"Instrument Sans","SF Pro Display",sans-serif;font-size:21px;font-weight:700;letter-spacing:-.04em}
    .learn-grid{gap:14px}
    .learn-item{font-size:12.5px;line-height:1.6}

    /* Responsive refinements */
    @media(max-width:1050px){
      .manage-grid{grid-template-columns:230px minmax(0,1fr)}
      .page-footer{left:230px}
      .page-wrap{padding-left:32px;padding-right:32px}
      .page-footer-inner{padding-left:32px;padding-right:32px}
      .curriculum-layout{grid-template-columns:1fr}
      .editor{position:relative;top:0;max-height:none}
      .sidebar{font-size:12px}
      .nav-item{padding-left:10px;padding-right:10px}
      .nav-item.active{padding-left:10px}
      .nav-group-title,.side-summary{padding-left:10px;padding-right:10px}
    }
    @media(max-width:760px){
      body{background:#eceeef}
      .wizard-top,.wizard-footer{padding-left:16px;padding-right:16px}
      .wizard-main{padding:36px 16px 48px}
      .wizard-title{font-size:34px}
      .choice-card{min-height:148px;padding:22px}
      .topbar{height:64px}
      .page-wrap{padding:32px 16px 116px}
      .page-title{font-size:32px}
      .page-footer-inner{padding:11px 16px}
      .preview-hero{padding:34px 18px}
      .preview-title{font-size:34px}
      .preview-body{padding:28px 14px 50px}
      .preview-box{padding:20px;border-radius:16px}
      .upload-card{border-radius:16px}
      .page-header{padding-bottom:24px}
    }

  
    /* ─────────────────────────────────────────────────────────────
       TUTORIA CREATOR — DEEP GRAPHITE / SHARP CARD OVERRIDE
       Matched to the supplied creator-studio reference.
    ───────────────────────────────────────────────────────────── */
    :root{
      --ink:#f1f1f2;
      --muted:#8f9096;
      --line:#343438;
      --soft:#252528;
      --panel:#1c1c1f;
      --purple:#ededee;
      --purple-dark:#ffffff;
      --purple-soft:#29292d;
      --nav:#0d0d0f;
      --ok:#a9c8b4;
      --warn:#d2b17b;
      --danger:#d39a91;
      --shadow:none;
      --shadow-lg:0 24px 70px rgba(0,0,0,.46);
      --radius-sm:4px;
      --radius:6px;
      --radius-lg:8px;
    }

    html,body{background:#0d0d0f;color:var(--ink)}
    body{color-scheme:dark}
    ::selection{background:#ececed;color:#111113}
    *{scrollbar-color:#48484d transparent}
    *::-webkit-scrollbar-thumb{background:#48484d;border-radius:3px}

    /* Shared controls — darker, flatter, sharper */
    .btn{
      border-color:#3a3a3f;
      border-radius:4px;
      background:#242427;
      color:#e9e9eb;
      box-shadow:none;
    }
    .btn:hover{background:#2e2e32;border-color:#55555b;box-shadow:none;transform:none}
    .btn-primary{background:#ececed;border-color:#ececed;color:#111113;box-shadow:none}
    .btn-primary:hover{background:#fff;border-color:#fff;box-shadow:none}
    .btn-ghost{background:transparent;border-color:transparent}
    .btn-ghost:hover{background:#242427;border-color:transparent}
    .btn-danger{color:#e2a39a;border-color:#63413d;background:#241817}
    .btn-sm{border-radius:4px}

    .field{
      border-color:#3b3b40;
      border-radius:4px;
      background:#111113;
      color:#efeff0;
      box-shadow:none;
    }
    .field:hover{border-color:#505057;background:#141416}
    .field:focus{border-color:#8a8a91;background:#111113;box-shadow:0 0 0 2px rgba(225,225,228,.12)}
    .field::placeholder{color:#626268}
    .field:disabled{color:#77777d;background:#18181a}
    select.field{
      background-color:#111113;
      background-image:linear-gradient(45deg,transparent 50%,#9b9ba1 50%),linear-gradient(135deg,#9b9ba1 50%,transparent 50%);
    }
    input[type="checkbox"],input[type="radio"]{accent-color:#e4e4e6}
    .label{color:#d8d8da}
    .help,.section-desc,.page-desc{color:#88898f}
    .count{color:#73747a}

    /* Setup wizard */
    .wizard-shell{background:#0d0d0f}
    .wizard-shell::before{display:none}
    .wizard-top,.wizard-footer{background:#101012;border-color:#29292d;backdrop-filter:none}
    .wizard-progress{background:#242428}
    .wizard-progress>span{background:#e9e9eb}
    .wizard-main{background:#0d0d0f}
    .wizard-title{color:#f2f2f3}
    .wizard-sub{color:#8e8f95}
    .wizard-eyebrow,.page-kicker,.section-label{color:#77787f}
    .choice-card,.wizard-field,.time-option{
      border-color:#343438;
      border-radius:6px;
      background:#1a1a1d;
      box-shadow:none;
      backdrop-filter:none;
    }

(() => {

ck understanding\n\nSection 2 · Guided practice">${esc(state.structureNotes)}</textarea></section>`}

  function filmEditPage(){return pageHeader('Create','Film & edit','Use these production guidelines while recording and editing your course videos.')+`<section class="udemy-guide-hero"><div class="udemy-guide-copy"><h2>You’re ready to share your knowledge.</h2><p>Record with the same setup you tested, keep your delivery clear and direct, and edit each lecture so the visuals and audio support the learning objective.</p><button class="btn" data-page-link="setup-test-video"><i data-lucide="video" class="icon"></i>Review your test video</button></div><div class="udemy-guide-art edit-art" aria-hidden="true"><span class="play-triangle"></span><span class="wave"></span></div></section><section class="udemy-guide-section"><h2>Tips</h2><p class="section-intro">These pages on Udemy are guidance-only. Your actual videos are added from Curriculum, individually or with the bulk uploader.</p><div class="udemy-guide-list">${[['01','Script or outline each lecture','Plan what you will say and show before recording. A clear script or speaking outline keeps delivery concise and reduces editing time.'],['02','Keep one objective per lecture','Make the purpose clear at the start, teach the concept or task, then recap the key takeaway before moving on.'],['03','Prioritize clear audio','Record close to the microphone, reduce echo and background noise, and make sure audio is present in both channels and synchronized with video.'],['04','Use dynamic, relevant visuals','Show the instructor, demonstrations, screencasts, diagrams, or other visuals that directly support the narration. Avoid audio-only video or long static slides.'],['05','Edit distractions out','Remove long pauses, verbal mistakes, repeated takes, and anything that prevents the learner from following the explanation.'],['06','Export in a learner-ready format','Use horizontal 16:9 video at 720p or 1080p. Check readability at normal playback size before uploading.'],['07','Keep your original files','Store recordings, project files, slides, and final exports outside the platform so you can revise or replace lectures later.']].map(([n,t,d])=>`<article class="udemy-guide-row"><div class="udemy-guide-index">${n}</div><div><h3>${t}</h3><p>${d}</p></div></article>`).join('')}</div></section><section class="udemy-guide-section"><h2>Technical requirements</h2><div class="udemy-requirements"><div class="udemy-requirement"><i data-lucide="monitor-play" class="icon"></i><strong>HD, horizontal video</strong><span>Minimum 720p resolution with a 16:9 aspect ratio.</span></div><div class="udemy-requirement"><i data-lucide="audio-lines" class="icon"></i><strong>Clear, synchronized audio</strong><span>Speech must be easy to understand, free of distracting noise, and audible through both channels.</span></div><div class="udemy-requirement"><i data-lucide="presentation" class="icon"></i><strong>Relevant visual instruction</strong><span>Visuals should be dynamic, custom, and clearly connected to what is being taught.</span></div><div class="udemy-requirement"><i data-lucide="scissors" class="icon"></i><strong>Concise delivery</strong><span>Edit out mistakes, long pauses, tangents, and other distractions.</span></div></div></section><section class="udemy-guide-section"><h2>Resources</h2><div class="udemy-resource-links"><a class="udemy-resource-link" href="https://support.udemy.com/hc/en-us/articles/229232767-Video-standards" target="_blank" rel="noopener"><span>Video standards<small>Resolution, aspect ratio, and visual-quality requirements</small></span><i data-lucide="external-link" class="icon"></i></a><a class="udemy-resource-link" href="https://support.udemy.com/hc/en-us/articles/229232367-Audio-Standards" target="_blank" rel="noopener"><span>Audio standards<small>Clarity, synchronization, and noise guidance</small></span><i data-lucide="external-link" class="icon"></i></a><a class="udemy-resource-link" href="https://support.udemy.com/hc/en-us/articles/229605228-Instructor-delivery-Quality-standards" target rea></div><div class="help">Description should have a minimum of 200 words. Do not include coupon codes, referral links, or external links.</div></section><section class="ud-form-block"><h2 class="section-title">Basic info</h2><div class="ud-basic-grid"><label><span class="label">Language</span><select class="field" data-bind="language"><option value="">-- Select --</option>${languages.map(value=>`<option ${state.language===value?'selected':''}>${value}</option>`).join('')}</select></label><label><span class="label">Level</span><select class="field" data-bind="level"><option value="">-- Select --</option>${levels.map(value=>`<option ${state.level===value?'selected':''}>${value}</option>`).join('')}</select></label><label><span class="label">Category</span><select class="field" data-bind="category"><option value="">-- Select --</option>${categories.map(value=>`<option ${state.category===value?'selected':''}>${value}</option>`).join('')}</select></label><label><span class="label">Subcategory</span><input class="field" data-bind="subcategory" value="${esc(state.subcategory)}" placeholder="Select a subcategory"></label></div></section><section class="ud-form-block"><div class="ud-topic-heading"><h2>What is primarily taught in your course?</h2><i data-lucide="info" class="icon"></i></div>${state.topics.length?`<div class="ud-topic-pills">${state.topics.map((topic,index)=>`<span class="ud-topic-pill">${esc(topic)}<button data-remove-topic="${index}" aria-label="Remove ${esc(topic)}"><i data-lucide="x" class="icon"></i></button></span>`).join('')}</div>`:''}<div class="ud-topic-propose"><input class="field" data-bind="topicDraft" value="${esc(state.topicDraft)}" placeholder="Propose another topic..."><button class="btn" data-add-topic ${state.topics.length>=4?'disabled':''}>Add</button></div><div class="help">Choose up to four specific topics that accurately represent the majority of the course.</div></section><section class="ud-form-block ud-media-section"><div class="ud-   }
  function faqPage(){

  function pricingPage(){const amount=Number(priceDigits(state.priceTier));return pageHeader('Publish','Pricing','Choose free enrollment or set a one-time purchase price. Currency display and local price tiers can vary by market.')+`<div class="grid-2"><label class="radio-card"><input type="radio" name="priceMode" value="free" ${state.priceMode==='free'?'checked':''}><span><strong>Free</strong><span class="help" style="display:block">Anyone can enroll without payment. Free courses are limited to two hours of video in Udemy’s current model.</span></span></label><label class="radio-card"><input type="radio" name="priceMode" value="paid" ${state.priceMode==='paid'?'checked':''}><span><strong>Paid</strong><span class="help" style="display:block">Learners pay once for ongoing access.</span></span></label></div>${state.priceMode==='paid'?`<section class="panel" style="margin-top:20px"><label><span class="label">Course price</span><div class="price-input-wrap"><span class="price-prefix">VND</span><input class="field price-input" inputmode="numeric" data-bind="priceTier" value="${esc(state.priceTier)}" placeholder="499,000"></div><div class="help">Learner display: ${amount?displayPrice(state.priceTier):'Enter an amount'} · Marketplaces may map this to local pricing tiers.</div></label><div class="grid-2" style="margin-top:18px"><label class="check-card"><input type="checkbox" data-bind-checkbox="premiumInstructor" ${state.premiumInstructor?'checked':''}><span><strong>Premium instructor approved</strong><span class="help" style="display:block">Required to charge for a course.</span></span></label><label class="check-card"><input type="checkbox" data-bind-checkbox="payoutReady" ${state.payoutReady?'checked':''}><span><strong>Payout method configured</strong><span class="help" style="display:block">Needed before paid earnings can be disbursed.</span></span></label><label class="check-card"><input type="checkbox" data-bind-checkbox="taxInfo" ${state.taxInfo?'checked':''}><span><strong>Tax information submitted</strong><span class="help" style="display:block">Tax documentation may be required based on account and country.</span></span></label><label class="check-card"><input type="checkbox" data-bind-checkbox="deals" ${state.deals?'checked':''}><span><strong>Participate in marketplace deals</strong><span class="help" style="display:block">Allow eligible promotional pricing.</span></span></label></div></section>`:`<div class="info warning" style="margin-top:20px"><i data-lucide="clock-3" class="icon"></i><div><strong>Free-course video limit</strong><div class="help">This prototype warns when video content exceeds 120 minutes. Current video total: ${videoMinutes()} minutes.</div></div></div>`}` }
  function promotionsPage(){return pageHeader('Publish','Promotions','Use your instructor referral link and create targeted coupons after the course is approved and published.',`<button class="btn" data-bulk-coupon><i data-lucide="file-up" class="icon"></i>Bulk coupon CSV</button>`)+`<section class="section"><h2 class="section-title">Instructor referral link</h2><p class="section-desc">Share this unique link to attribute eligible sales to your own marketing.</p><div class="row promotions-link-row"><input class="field" readonly value="https://tutoria.vn/course/${slug(state.title)}?ref=instructor"><button class="btn" data-copy-link>Copy</button></div></section><section class="section"><div class="row between"><div><h2 class="section-title">Coupons</h2><p class="section-desc">Create best-price, custom-price, or free coupons with an expiration date and redemption limit.</p></div><button class="btn" data-add-coupon><i data-lucide="plus" class="icon"></i>New coupon</button></div><div class="coupon-table"><div class="coupon-row coupon-head"><span>Code</span><span>Type</span><span>Price</span><span>Expires</span><span>Redemptions</span><span></span></div>${state.coupons.length?state.coupons.map(coupon=>`<div class="coupon-row"><strong>${esc(coupon.code)}</strong><span>${esc(coupon.type)}</span><span>${esc(coupon.price||'—')}</span><span>${esc(coupon.expires)}</span><span>${Number(coupon.used)||0}/${Number(coupon.limit)||1000}</span><button class="icon-btn" data-remove-coupon="${coupon.id}"><i data-lucide="trash-2" class="icon"></i></button></div>`).join(''):`<div class="caption-empty-list"><i data-lucide="ticket" class="icon"></i><strong>No coupons yet</strong><span>Create one manually or import a CSV.</span></div>`}</div></section>`}
  function messagesPage(){const preview=state.messagePreview==='completion'?state.completion:state.welcome;return pageHeader('Publish','Course messages','Optional messages are sent automatically when a learner enrolls and when they complete the course.')+`<div class="info"><i data-lucide="shield-check" class="icon"></i><div><strong>Keep these messages course-focused</strong><div class="help">Do not include coupon codes, unrelated promotions, or requests to move learners away from the learning experience.</div></div></div><div class="grid-2" style="margin-top:22px"><div class="stack"><label><div class="row between"><span class="label">Welcome message</span><span class="count">${state.welcome.length}/1000</span></div><textarea class="field" maxlength="1000" data-bind="welcome" style="min-height:190px" placeholder="Welcome learners and tell them how to begin.">${esc(state.welcome)}</textarea></label><label><div class="row between"><span class="label">Congratulations message</span><span class="count">${state.completion.length}/1000</span></div><textarea class="field" maxlength="1000" data-bind="completion" style="min-height:190px" placeholder="Celebrate completion and suggest appropriate next steps.">${esc(state.completion)}</textarea></label></div><aside class="message-preview"><div class="preview-tabs"><button class="preview-tab ${state.messagePreview!=='completion'?'active':''}" data-message-preview="welcome">Welcome</button><button class="preview-tab ${state.messagePreview==='completion'?'active':''}" data-message-preview="completion">Completion</button></div><div class="message-bubble"><div class="preview-avatar">${esc((state.instructor.name||'I')[0])}</div><div><strong>${esc(state.instructor.name||'Instructor')}</strong><p>${esc(preview||'Your message preview appears here.')}</p></div></div></aside></div>`}
  function reviewPage(){const checks=reviewChecks(),completed=checks.filter(check=>check.done).length,percent=Math.round(completed/checks.length*100);return pageHeader('Publish','Submit for review','Resolve every required item, confirm ownership and identity, then submit the course to the quality review queue.')+`<div class="grid-2"><div class="panel panel-soft"><div class="review-percent">${percent}%</div><strong>Ready for review</strong><div class="help">${completed} of ${checks.length} submission requirements complete.</div><div class="curriculum-meter" style="margin-top:16px"><span style="width:${percent}%"></span></div></div><div class="panel"><label><span class="label">Course URL</span><div class="url-field"><span>tutoria.vn/course/</span><input class="field" data-bind="courseUrl" value="${esc(state.courseUrl)}" placeholder="${slug(state.title)}"></div></label><div class="help">The URL must be unique and should remain stable after publication.</div></div></div><div class="panel" style="margin-top:22px">${checks.map(check=>`<div class="review-row ${check.done?'done':''}"><div class="review-icon">${check.done?'✓':'!'}</div><div><div class="review-title">${check.label}</div><div class="review-detail">${check.detail}</div></div>${check.target?`<button class="btn btn-sm" data-page-link="${check.target}">${check.done?'Review':'Fix'}</button>`:''}</div>`).join('')}</div><section class="section" style="margin-top:22px"><div class="grid-2"><label class="check-card"><input type="checkbox" data-bind-checkbox="identityVerified" ${state.identityVerified?'checked':''}><span><strong>Identity verification completed</strong><span class="help" style="display:block">Required before the first marketplace publication.</span></span></label><label class="check-card"><input type="checkbox" data-bind-checkbox="termsAccepted" ${state.termsAccepted?'checked':''}><span><strong>I own or have permission to use all content</strong><span class="help" style="display:block">Includes video, audio, images, code, downloads, trademarks, and third-party material.</span></span></label></div></section>${state.reviewStatus==='submitted'?`<div class="info success"><i data-lucide="send" class="icon"></i><div><strong>Submitted for quality review</strong><div class="help">Submitted ${esc(state.submittedAt)}. Review status is stored locally in this prototype.</div></div></div>`:`<div class="review-submit"><div><strong>${allReviewReady()?'Your course is ready':'Complete the remaining requirements'}</strong><div class="help">A reviewer checks technical quality, landing-page accuracy, policy compliance, and learner experience.</div></div><button class="btn btn-primary" data-submit-review ${allReviewReady()?'':'disabled'}><i data-lucide="send" class="icon"></i>Submit for review</button></div>`}` }
  function footerTemplate(){const pages=getPageList(),idx=pages.findIndex(p=>p.id===state.currentPage),last=idx===pages.length-1;return `<footer class="page-footer"><div class="page-footer-inner"><div class="row"><button class="btn btn-ghost" data-prev-page ${idx===0?'disabled':''}><i data-lucide="chevron-left" class="icon"></i>Previous</button><span class="save-state"><span data-save-label>${state.saveStatus}</span></span></div><div class="row"><button class="btn" data-save>Save</button>${last?`<button class="btn btn-primary" data-submit-review ${allReviewReady()&&state.reviewStatus!=='submitted'?'':'disabled'}>Submit for review</button>`:`<button class="btn btn-primary" data-next-page>Save & continue<i data-lucide="chevron-right" class="icon"></i></button>`}</div></div></footer>`}
  function bindManager(){
    document.querySelectorAll('[data-page-link]').forEach(button=>button.onclick=()=>{state.currentPage=button.dataset.pageLink;render()});
    const mobilePage=document.querySelector('[data-mobile-page]');if(mobilePage)mobilePage.onchange=event=>{state.currentPage=event.target.value;render()};
    document.querySelectorAll('[data-save]').forEach(button=>button.onclick=()=>{persist();showToast('Changes saved')});
    document.querySelectorAll('[data-preview]').forEach(button=>button.onclick=openPreview);
    const settings=document.querySelector('[data-course-settings]');if(settings)settings.onclick=courseSettingsModal;
    const back=document.querySelector('[data-back-courses]');if(back)back.onclick=()=>{if(window.top!==window)window.top.location.href='/courses';else window.history.back()};
    const pages=getPageList(),index=pages.findIndex(page=>page.id===state.currentPage),previous=document.querySelector('[data-prev-page]'),next=document.querySelector('[data-next-page]');
    if(previous)previous.onclick=()=>{state.currentPage=pages[Math.max(0,index-1)].id;render()};
    if(next)next.onclick=()=>{persist();state.currentPage=pages[Math.min(pages.length-1,index+1)].id;render()};
    bindCommonInputs();bindPageActions();
  }
  function bindCommonInputs(){
    document.querySelectorAll('[data-bind]').forEach(el=>{const path=el.dataset.bind;const handler=e=>{setPath(path,e.target.value);updateInlineCounts();autosave()};el.oninput=handler;el.onchange=handler});
    document.querySelectorAll('[data-bind-checkbox]').forEach(el=>el.onchange=e=>{setPath(el.dataset.bindCheckbox,e.target.checked);autosave();render()});
    document.querySelectorAll('[data-array]').forEach(el=>el.oninput=e=>{state[e.target.dataset.array][Number(e.target.dataset.index)]=e.target.value;autosave()});
    document.querySelectorAll('[data-add-array]').forEach(b=>b.onclick=()=>{state[b.dataset.addArray].push('');autosave();render()});
    document.querySelectorAll('[data-remove-array]').forEach(b=>b.onclick=()=>{state[b.dataset.removeArray].splice(Number(b.dataset.index),1);autosave();render()});
    document.querySelectorAll('[data-check-group]').forEach(el=>el.onchange=e=>{state[e.target.dataset.checkGroup][e.target.dataset.checkKey]=e.target.checked;autosave();render()});
  }
  function formatDescription(kind){const textarea=document.getElementById('courseDescription');if(!textarea)return;const start=textarea.selectionStart,end=textarea.selectionEnd,value=textarea.value,selected=value.slice(start,end);let before='',after='';if(kind==='bold'){before='**';after='**'}if(kind==='italic'){before='*';after='*'}if(kind==='bullet'){before=selected.includes('\n')?'• ':'• ';after=''}if(kind==='number'){before='1. ';after=''}const replacement=before+(selected||'text')+after;textarea.value=value.slice(0,start)+replacement+value.slice(end);state.description=textarea.value;autosave();textarea.focus();textarea.setSelectionRange(start+before.length,start+replacement.length-after.length);updateInlineCounts()}
    function bindPageActions(){
    document.querySelectorAll('[data-file-button]').forEach(button=>button.onclick=()=>document.getElementById(button.dataset.fileButton)?.click());
    fileHandler('testVideoFile',file=>{state.testVideo={name:file.name,status:'ready',feedback:''}});
    fileHandler('promoFile',file=>state.promoName=file.name);
    fileHandler('coverFile',file=>{state.coverName=file.name;const reader=new FileReader();reader.onload=()=>{state.coverUrl=reader.result;autosave();render()};reader.readAsDataURL(file)});
    fileHandler('instructorPhoto',file=>{state.instructor.photoName=file.name;const reader=new FileReader();reader.onload=()=>{state.instructor.photoUrl=reader.result;autosave();render()};reader.readAsDataURL(file)});
    const submitTest=document.querySelector('[data-submit-test]');if(submitTest)submitTest.onclick=()=>{state.testVideo.status='submitted';state.testVideo.feedback='Framing and resolution pass. Move the microphone closer and reduce room echo before recording the full course.';autosave();render()};
    document.querySelectorAll('input[name="priceMode"]').forEach(input=>input.onchange=event=>{state.priceMode=event.target.value;autosave();render()});
    const downloadOutline=document.querySelector('[data-download-outline]');if(downloadOutline)downloadOutline.onclick=()=>downloadText(`${slug(state.title)||'course'}-outline-template.csv`,'Section title,Section learning objective,Lecture title,Lecture format,Practice activity,Resources needed\nIntroduction,Orient learners and provide an early win,Welcome and course overview,Video,,Course guide\nSection 2,Describe the skill learners will achieve,Focused lecture title,Video or article,Quiz or assignment,Worksheet or source files');
    document.querySelectorAll('[data-open-bulk]').forEach(button=>button.onclick=bulkUploaderModal);
    document.querySelectorAll('[data-open-library]').forEach(button=>button.onclick=()=>mediaLibraryModal(button.dataset.libraryTarget||''));
    document.querySelectorAll('[data-import-practice]').forEach(button=>button.onclick=practiceImportModal);
    document.querySelectorAll('[data-media-source]').forEach(button=>button.onclick=()=>{const item=selectedItem();item.source=button.dataset.mediaSource;autosave();render()});
    const external=document.querySelector('[data-import-external]');if(external)external.onclick=()=>{const item=selectedItem();if(!item.externalUrl.trim())return showToast('Paste an external file URL');item.fileName=item.externalUrl.split('/').pop()||'Imported video.mp4';item.mediaStatus='processing';item.processingProgress=72;setTimeout(()=>{item.mediaStatus='ready';item.processingProgress=100;persist();render()},700);autosave();render()};
    document.querySelectorAll('[data-preview-item]').forEach(button=>button.onclick=()=>itemPreviewModal(button.dataset.previewItem));
    const addTopic=document.querySelector('[data-add-topic]');if(addTopic)addTopic.onclick=()=>{const topic=state.topicDraft.trim();if(!topic)return showToast('Enter a topic');if(state.topics.length>=4)return showToast('You can add up to four topics');state.topics.push(topic);state.topicDraft='';autosave();render()};
    document.querySelectorAll('[data-remove-topic]').forEach(button=>button.onclick=()=>{state.topics.splice(Number(button.dataset.removeTopic),1);autosave();render()});
    document.querySelectorAll('[data-open-add-menu]').forEach(button=>button.onclick=()=>{state.addItemMenuSectionId=state.addItemMenuSectionId===button.dataset.openAddMenu?'':button.dataset.openAddMenu;render()});
    const addSection=document.querySelector('[data-add-section]');if(addSection)addSection.onclick=()=>{state.addingSection=true;render()};

    document.querySelectorAll('[data-format-description]').forEach(button=>button.onclick=()=>formatDescription(button.dataset.formatDescription));

    document.querySelectorAll('[data-item-move]').forEach(button=>button.onclick=()=>moveItem(button.dataset.section,button.dataset.id,button.dataset.itemMove));

     curriculum uploads, quiz imports, previews, and coupon validation.
  ───────────────────────────────────────────────────────────── */
  const QA_DB_NAME='tutoria-creator-assets-v1';
  const QA_STORE='assets';
  const qaMemoryFiles=new Map();
  const qaDate=()=>new Date().toISOString();
  const qaSize=n=>{const value=Number(n)||0;if(value<1024)return `${value} B`;if(value<1024**2)return `${(value/1024).toFixed(1)} KB`;if(value<1024**3)return `${(value/1024**2).toFixed(1)} MB`;return `${(value/1024**3).toFixed(2)} GB`};
  const qaBaseName=name=>String(name||'Untitled').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
  const qaVideoTypes=/^(video\/|audio\/)/;
  const qaSupportedExt=/\.(mp4|mov|m4v|webm|avi|mpeg|mpg|wmv|flv|mp3|wav|m4a|aac|ogg|pdf|ppt|pptx|doc|docx|zip|csv|vtt|srt|txt|png|jpe?g|gif|webp)$/i;

  state.mediaLibrary=Array.isArray(state.mediaLibrary)?state.mediaLibrary:[];
  state.testVideo=Object.assign({name:'',status:'not-submitted',feedback:'',assetId:'',analysis:null,error:'',progress:0},state.testVideo||{});
  state.coupons=(state.coupons||[]).map(c=>Object.assign({active:true,createdAt:qaDate()},c));

  function qaOpenDb(){return new Promise((resolve,reject)=>{if(!('indexedDB'in window))return resolve(null);const request=indexedDB.open(QA_DB_NAME,1);request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(QA_STORE))db.createObjectStore(QA_STORE,{keyPath:'id'})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
  async function qaPutAsset(idValue,file){qaMemoryFiles.set(idValue,file);try{const db=await qaOpenDb();if(!db)return;await new Promise((resolve,reject)=>{const tx=db.transaction(QA_STORE,'readwrite');tx.objectStore(QA_STORE).put({id:idValue,blob:file,name:file.name||'file',type:file.type||'',size:file.size||0,updatedAt:qaDate()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(error){console.warn('IndexedDB save failed',error)}}
  async function qaGetAsset(idValue){if(!idValue)return null;if(qaMemoryFiles.has(idValue))return qaMemoryFiles.get(idValue);try{const db=await qaOpenDb();if(!db)return null;const record=await new Promise((resolve,reject)=>{const tx=db.transaction(QA_STORE,'readonly');const req=tx.objectStore(QA_STORE).get(idValue);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(record?.blob){const file=new File([record.blob],record.name||'file',{type:record.type||record.blob.type});qaMemoryFiles.set(idValue,file);return file}}catch(error){console.warn('IndexedDB read failed',error)}return null}
  async function qaDeleteAsset(idValue){qaMemoryFiles.delete(idValue);try{const db=await qaOpenDb();if(!db)return;await new Promise((resolve,reject)=>{const tx=db.transaction(QA_STORE,'readwrite');tx.objectStore(QA_STORE).delete(idValue);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}catch(error){console.warn('IndexedDB delete failed',error)}}

  function qaValidateFile(file,kind='general'){
    if(!file)return 'No file selected.';
    if(file.size===0)return 'The selected file is empty.';
    if(file.size>2*1024*1024*1024)return 'Files larger than 2 GB are not supported in this browser prototype.';
    if(kind==='video'&&!String(file.type).startsWith('video/'))return 'Choose a video file.';
    if(kind==='caption'&&!/\.(vtt|srt)$/i.test(file.name))return 'Caption files must be VTT or SRT.';
    if(kind==='csv'&&!/\.csv$/i.test(file.name))return 'Choose a CSV file.';
    if(kind==='general'&&!file.type&&!qaSupportedExt.test(file.name))return 'This file type is not supported.';
    return '';
  }
  function qaReadVideoMetadata(blob){return new Promise((resolve,reject)=>{const url=URL.createObjectURL(blob),video=document.createElement('video');video.preload='metadata';video.muted=true;video.playsInline=true;const cleanup=()=>URL.revokeObjectURL(url);video.onloadedmetadata=()=>{const data={duration:Number.isFinite(video.duration)?video.duration:0,width:video.videoWidth||0,height:video.videoHeight||0,aspect:video.videoHeight?video.videoWidth/video.videoHeight:0};cleanup();resolve(data)};video.onerror=()=>{cleanup();reject(new Error('The browser could not read this video. Try MP4/H.264 or WebM.'))};video.src=url})}
  async function qaAnalyzeFrames(blob,metadata,onProgress=()=>{}){
    const url=URL.createObjectURL(blob),video=document.createElement('video');video.preload='auto';video.muted=true;video.playsInline=true;video.src=url;
    await new Promise((resolve,reject)=>{video.onloadeddata=resolve;video.onerror=()=>reject(new Error('Video frames could not be decoded.'))});
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});const scale=Math.min(1,320/(metadata.width||320));canvas.width=Math.max(2,Math.round((metadata.width||320)*scale));canvas.height=Math.max(2,Math.round((metadata.height||180)*scale));
    const times=[.18,.5,.82].map(p=>Math.min(Math.max(0,(metadata.duration||1)*p),Math.max(0,(metadata.duration||1)-.08)));const stats=[];
    for(let i=0;i<times.length;i++){
      video.currentTime=times[i];await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('Frame seek timed out.')),5000);video.onseeked=()=>{clearTimeout(timer);resolve()}});
      ctx.drawImage(video,0,0,canvas.width,canvas.height);const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let sum=0,sum2=0,dark=0,bright=0,sharp=0,count=0;
      const lumas=new Float32Array(canvas.width*canvas.height);for(let p=0,j=0;p<data.length;p+=4,j++){const y=.2126*data[p]+.7152*data[p+1]+.0722*data[p+2];lumas[j]=y;sum+=y;sum2+=y*y;if(y<28)dark++;if(y>238)bright++;count++}
      for(let y=1;y<canvas.height-1;y+=2){for(let x=1;x<canvas.width-1;x+=2){const j=y*canvas.width+x;sharp+=Math.abs(4*lumas[j]-lumas[j-1]-lumas[j+1]-lumas[j-canvas.width]-lumas[j+canvas.width])}}
      const mean=sum/count,variance=Math.max(0,sum2/count-mean*mean);stats.push({brightness:mean,contrast:Math.sqrt(variance),darkPct:dark/count*100,brightPct:bright/count*100,sharpness:sharp/Math.max(1,(canvas.width*canvas.height/4))});onProgress(40+(i+1)*10);
    }
    URL.revokeObjectURL(url);return ['brightness','contrast','darkPct','brightPct','sharpness'].reduce((out,key)=>(out[key]=stats.reduce((n,s)=>n+s[key],0)/stats.length,out),{});
  }
  async function qaAnalyzeAudio(blob,onProgress=()=>{}){
    const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return {available:false,reason:'Web Audio is unavailable.'};let context;
    try{context=new AudioCtx();const buffer=await blob.arrayBuffer();onProgress(76);const decoded=await context.decodeAudioData(buffer.slice(0));const channel=decoded.getChannelData(0);const step=Math.max(1,Math.floor(channel.length/240000));let sum=0,peak=0,clip=0,silent=0,count=0;for(let i=0;i<channel.length;i+=step){const v=Math.abs(channel[i]);sum+=v*v;peak=Math.max(peak,v);if(v>=.985)clip++;if(v<.003)silent++;count++}const rms=Math.sqrt(sum/Math.max(1,count));return {available:true,channels:decoded.numberOfChannels,sampleRate:decoded.sampleRate,rms,rmsDb:rms?20*Math.log10(rms):-Infinity,peak,clipPct:clip/Math.max(1,count)*100,silentPct:silent/Math.max(1,count)*100}}
    catch(error){return {available:false,reason:'The audio track could not be decoded in this browser.'}}
    finally{try{await context?.close()}catch{}}
  }
  function qaCheck(label,status,value,detail,points,max){return {label,status,value,detail,points,max}}
  async function qaAssessVideo(file,onProgress=()=>{}){
    const metadata=await qaReadVideoMetadata(file);onProgress(28);const frames=await qaAnalyzeFrames(file,metadata,onProgress);onProgress(72);const audio=await qaAnalyzeAudio(file,onProgress);onProgress(92);
    const checks=[];const resPass=metadata.width>=1280&&metadata.height>=720;checks.push(qaCheck('Resolution',resPass?'pass':metadata.width>=960?'warn':'fail',`${metadata.width} × ${metadata.height}`,resPass?'Meets the 720p minimum.':'Export at 1280 × 720 or higher.',resPass?18:metadata.width>=960?9:0,18));
    const duration=metadata.duration;const durationPass=duration>=60&&duration<=180;const durationWarn=duration>=30&&duration<=300;checks.push(qaCheck('Duration',durationPass?'pass':durationWarn?'warn':'fail',`${Math.round(duration)} sec`,durationPass?'Within the recommended 1–3 minutes.':'Use a focused 1–3 minute sample.',durationPass?10:durationWarn?6:0,10));
    const ratio=metadata.aspect||0;const ratioPass=ratio>=1.7&&ratio<=1.82;checks.push(qaCheck('Aspect ratio',ratioPass?'pass':ratio>=1.5&&ratio<=2.0?'warn':'fail',ratio?ratio.toFixed(2):'Unknown',ratioPass?'Close to standard 16:9.':'Use a standard landscape 16:9 frame.',ratioPass?6:ratio>=1.5&&ratio<=2?3:0,6));
    const b=frames.brightness;const lightPass=b>=65&&b<=195;checks.push(qaCheck('Exposure',lightPass?'pass':b>=45&&b<=220?'warn':'fail',`${Math.round(b)}/255`,lightPass?'Average exposure is balanced.':b<65?'The sampled frames are dark. Add light or raise exposure.':'Highlights may be too bright. Reduce light or exposure.',lightPass?14:b>=45&&b<=220?8:0,14));
    const c=frames.contrast;checks.push(qaCheck('Visual contrast',c>=38?'pass':c>=24?'warn':'fail',c.toFixed(1),c>=38?'Subject and screen separation looks healthy.':'Increase separation between foreground and background.',c>=38?10:c>=24?6:2,10));
    const sh=frames.sharpness;checks.push(qaCheck('Image sharpness',sh>=25?'pass':sh>=14?'warn':'fail',sh.toFixed(1),sh>=25?'Frames appear reasonably sharp.':'Check focus, camera stability, and export quality.',sh>=25?10:sh>=14?6:1,10));
    if(audio.available){const rmsPass=audio.rmsDb>=-30&&audio.rmsDb<=-8;checks.push(qaCheck('Speech level',rmsPass?'pass':audio.rmsDb>=-38&&audio.rmsDb<=-4?'warn':'fail',`${audio.rmsDb.toFixed(1)} dBFS`,rmsPass?'Average level is in a practical range.':audio.rmsDb<-30?'Audio is quiet. Record closer or increase gain.':'Audio may be too loud.',rmsPass?16:audio.rmsDb>=-38&&audio.rmsDb<=-4?9:2,16));const clipPass=audio.clipPct<.15;checks.push(qaCheck('Audio clipping',clipPass?'pass':audio.clipPct<1?'warn':'fail',`${audio.clipPct.toFixed(2)}%`,clipPass?'No meaningful clipping detected.':'Lower microphone gain to prevent distortion.',clipPass?16:audio.clipPct<1?8:0,16))}
    else{checks.push(qaCheck('Audio inspection','warn','Unavailable',audio.reason,8,16));checks.push(qaCheck('Audio clipping','warn','Unavailable','Play the preview and verify that speech is clean and undistorted.',8,16))}
    const points=checks.reduce((n,c)=>n+c.points,0),max=checks.reduce((n,c)=>n+c.max,0),score=Math.round(points/max*100);const recommendations=checks.filter(c=>c.status!=='pass').map(c=>c.detail);return {score,grade:score>=85?'Ready':score>=70?'Needs minor fixes':'Needs work',checks,recommendations,metadata,frames,audio,analyzedAt:new Date().toLocaleString(),limitations:'Automated browser assessment checks duration, resolution, exposure, contrast, sharpness, level, and clipping. It cannot reliably judge presenter framing, teaching quality, room echo, pronunciation, or content accuracy.'}
  }
  async function qaRunTestAssessment(file){
    const error=qaValidateFile(file,'video');if(error){state.testVideo.error=error;state.testVideo.status='error';autosave();render();return}
    const assetId=state.testVideo.assetId||id();state.testVideo={name:file.name,status:'analyzing',feedback:'',assetId,error:'',progress:2,analysis:null,size:file.size,type:file.type};await qaPutAsset(assetId,file);autosave();render();
    try{const analysis=await qaAssessVideo(file,p=>{state.testVideo.progress=p;const bar=document.querySelector('[data-test-progress-bar]');if(bar)bar.style.width=`${p}%`;const label=document.querySelector('[data-test-progress-label]');if(label)label.textContent=`Analyzing ${Math.round(p)}%`});state.testVideo.analysis=analysis;state.testVideo.status='analyzed';state.testVideo.progress=100;state.testVideo.feedback=analysis.grade;persist();render();showToast(`Technical assessment complete: ${analysis.score}/100`)}catch(errorValue){state.testVideo.status='error';state.testVideo.error=errorValue.message||'Assessment failed.';persist();render();showToast('The video could not be assessed')}
  }

  const qaOriginalSetupTestPage=setupTestPage;
  setupTestPage=function(){
    const video=state.testVideo,analysis=video.analysis;const scoreClass=analysis?(analysis.score>=85?'pass':analysis.score>=70?'warn':'fail'):'warn';
    const report=analysis?`<div class="assessment-score"><div class="assessment-score-ring ${scoreClass}">${analysis.score}</div><div><strong>${esc(analysis.grade)}</strong><div class="help">Assessed ${esc(analysis.analyzedAt)}</div><div class="qa-caption-summary"><span class="qa-chip">${analysis.metadata.width} × ${analysis.metadata.height}</span><span class="qa-chip">${Math.round(analysis.metadata.duration)} sec</span><span class="qa-chip">${qaSize(video.size)}</span></div></div></div><div class="assessment-checks">${analysis.checks.map(check=>`<div class="assessment-check"><span class="qa-dot ${check.status}"></span><div><strong>${esc(check.label)}</strong><small>${esc(check.detail)}</small></div><span class="qa-value">${esc(check.value)}</span></div>`).join('')}</div><div class="info" style="margin-top:12px"><i data-lucide="info" class="icon"></i><div><strong>What this assessment can and cannot do</strong><div class="help">${esc(analysis.limitations)}</div></div></div>`:`<div class="panel panel-soft"><strong>No technical assessment yet</strong><div class="help">Upload a real video. The browser will inspect its metadata, sample frames, and—when the codec allows—its audio waveform.</div></div>`;
    return pageHeader('Plan','Setup & test video','Upload a short recording and run a real browser-side technical assessment before filming the full course.')+`<div class="assessment-shell"><div><div class="file-drop"><i data-lucide="upload-cloud" class="icon"></i><div style="font-weight:700;margin:10px 0 6px">${esc(video.name||'Upload your test video')}</div><div class="help">MP4 or WebM recommended · 720p minimum · 1–3 minutes</div><input id="testVideoFile" type="file" accept="video/*" class="hidden"><button class="btn btn-sm" data-file-button="testVideoFile" style="margin-top:14px">${video.name?'Replace video':'Choose file'}</button></div>${video.status==='analyzing'?`<div class="panel" style="margin-top:12px"><div class="qa-progress-label"><span data-test-progress-label>Analyzing ${Math.round(video.progress||0)}%</span><span>Do not close this tab</span></div><div class="qa-progress"><span data-test-progress-bar style="width:${video.progress||0}%"></span></div></div>`:''}${video.error?`<div class="qa-errors" style="margin-top:12px">${esc(video.error)}</div>`:''}${video.assetId&&video.status!=='analyzing'?`<div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn" data-preview-test><i data-lucide="play" class="icon"></i>Preview video</button><button class="btn" data-run-test-assessment><i data-lucide="scan-search" class="icon"></i>Run assessment again</button><button class="btn btn-primary" data-submit-test ${analysis?'':'disabled'}>${video.status==='submitted'?'Assessment reviewed':'Mark assessment reviewed'}</button></div>`:''}</div><div>${report}</div></div>`;
  };

  async function qaImportAsset(file){const error=qaValidateFile(file);if(error)throw new Error(error);const assetId=id();await qaPutAsset(assetId,file);let metadata={};if(String(file.type).startsWith('video/')){try{metadata=await qaReadVideoMetadata(file)}catch{}}const asset={id:assetId,name:file.name,type:file.type||'File',size:file.size,date:new Date().toLocaleDateString(),createdAt:qaDate(),duration:metadata.duration||0,width:metadata.width||0,height:metadata.height||0,status:'ready'};state.mediaLibrary.unshift(asset);return asset}
  function qaAssetById(assetId){return state.mediaLibrary.find(asset=>asset.id===assetId)}
  async function qaAttachFileToItem(item,field,file){const error=qaValidateFile(file,field==='fileName'?'video':'general');if(error)return showToast(error);item.mediaStatus='processing';item.processingProgress=10;render();try{const asset=await qaImportAsset(file);item[field]=file.name;if(field==='fileName'){item.assetId=asset.id;item.fileType=file.type;item.fileSize=file.size;item.source='upload';item.videoMinutes=asset.duration?Math.max(1,Math.ceil(asset.duration/60)):Math.max(1,Number(item.videoMinutes)||1);item.mediaStatus='ready';item.processingProgress=100}else{item.slidesAssetId=asset.id}persist();render();showToast(`${file.name} uploaded and stored`)}catch(errorValue){item.mediaStatus='error';persist();render();showToast(errorValue.message||'Upload failed')}}

  const qaBaseCurriculumPage=curriculumPage;
  curriculumPage=function(){return qaBaseCurriculumPage().replace('Video processing and external imports are simulated in this prototype.','Uploaded files are validated and stored in this browser. Video duration is detected automatically and local previews use the real file. External URLs depend on the remote provider allowing playback.')};

  bulkUploaderModal=function(){
    const sectionOptions=state.sections.map(section=>`<option value="${section.id}">${esc(section.title||'Untitled section')}</option>`).join('');
    modalRoot.innerHTML=`<div class="modal"><div class="modal-card library-modal"><div class="modal-head"><div><strong>Bulk uploader</strong><div class="help">Store files locally and optionally create curriculum items from videos and quiz CSV files.</div></div><button class="icon-btn" data-close-modal><i data-lucide="x" class="icon"></i></button></div><div class="modal-body"><div class="grid-2"><label><span class="label">Destination section</span><select id="qaBulkSection" class="field">${sectionOptions}</select></label><div class="stack"><label class="check-card"><input id="qaCreateLectures" type="checkbox" checked><span><strong>Create lectures from videos</strong><span class="help" style="display:block">Each video becomes a real curriculum lecture.</span></span></label><label class="check-card"><input id="qaCreateQuizzes" type="checkbox" checked><span><strong>Create quizzes from CSV</strong><span class="help" style="display:block">Uses question, answer_a…answer_d, correct_answer, explanation.</span></span></label></div></div><label class="library-drop" id="qaBulkDrop" style="margin-top:16px"><i data-lucide="files" class="icon"></i><strong>Choose or drop multiple files</strong><span>Videos, audio, PDFs, presentations, archives, captions, and CSV question banks.</span><input id="bulkFiles" type="file" multiple class="hidden"><button class="btn" type="button" data-bulk-choose>Choose files</button></label><div id="bulkSelection" class="qa-upload-list"></div><div id="qaBulkProgress" class="hidden"><div class="qa-progress-label"><span id="qaBulkProgressText">Preparing…</span><span id="qaBulkProgressCount"></span></div><div class="qa-progress"><span id="qaBulkProgressBar" style="width:0"></span></div></div></div><div class="modal-footer"><button class="btn" data-close-modal>Cancel</button><button class="btn btn-primary" data-bulk-save disabled>Upload files</button></div></div></div>`;

    save.onclick=async()=>{const valid=files.filter(file=>!qaValidateFile(file));if(!valid.length)return;save.disabled=true;document.getElementById('qaBulkProgress').classList.remove('hidden');const section=state.sections.find(s=>s.id===document.getElementById('qaBulkSection').value)||state.sections[0];let assets=0,lecturesCreated=0,quizzesCreated=0,lastItem=null;

          if(document.getElementById('qaCreateQuizzes').checked&&/\.csv$/i.test(file.name)){const rows=parseCsv(await file.text()),questions=qaQuestionsFromRows(rows);if(questions.length){const quiz=blankItem('quiz');quiz.title=qaBaseName(file.name);quiz.questions=questions;section.items.push(quiz);quizzesCreated++;lastItem=quiz}}

  mediaLibraryModal=function(targetItemId=''){

  function qaTimeToVtt(value){const raw=String(value||'').trim().replace(',','.');const parts=raw.split(':');if(parts.length===2)return `00:${parts[0].padStart(2,'0')}:${parts[1].padStart(6,'0')}`;if(parts.length===3)return `${parts[0].padStart(2,'0')}:${parts[1].padStart(2,'0')}:${parts[2].padStart(6,'0')}`;throw new Error(`Invalid timestamp: ${value}`)}
  function qaParseCaptionText(text,fileName='captions.vtt'){
    const cleaned=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'');let blocks=cleaned.split(/\n{2,}/).map(block=>block.trim()).filter(Boolean);if(/^WEBVTT/i.test(blocks[0]||''))blocks.shift();const entries=[];
    for(const block of blocks){const lines=block.split('\n').filter(Boolean);let timingIndex=lines.findIndex(line=>line.includes('-->'));if(timingIndex<0)continue;const [startRaw,endRawWithSettings]=lines[timingIndex].split('-->').map(v=>v.trim()),endRaw=endRawWithSettings.split(/\s+/)[0];const captionText=lines.slice(timingIndex+1).join('\n').trim();if(!captionText)continue;entries.push({id:id(),start:qaTimeToVtt(startRaw),end:qaTimeToVtt(endRaw),text:captionText})}
    if(!entries.length)throw new Error('No valid caption cues were found. Use standard VTT or SRT timestamps.');let previous=-1;const toSeconds=value=>{const [h,m,s]=value.split(':');return Number(h)*3600+Number(m)*60+Number(s)};for(const entry of entries){const start=toSeconds(entry.start),end=toSeconds(entry.end);if(end<=start)throw new Error(`A caption ends before it starts at ${entry.start}.`);if(start<previous)throw new Error('Caption cues must be in chronological order.');previous=start}return {entries,format:/\.srt$/i.test(fileName)?'SRT':'VTT',cueCount:entries.length,start:entries[0].start,end:entries[entries.length-1].end}
  }

  /* ─────────────────────────────────────────────────────────────
     UDEMY BULK UPLOADER PARITY PASS
     Mirrors the documented workflow while keeping storage local.
  ───────────────────────────────────────────────────────────── */
  const udVideoExt=/\.(avi|mpg|mpeg|flv|m2v|m4v|mp4|wmv|ogv|webm|mov)$/i;
  const udResourceExt=/\.(jpe?g|png|bmp|gif|webp|pdf|zip|xls|xlsx|csv|mov|mp4|m4v|wmv|avi|mpeg|mpg|ppt|pptx|doc|docx|txt|rtf|py|rb|wav|m4a|aac|ogg)$/i;
  const udCaptionExt=/\.(vtt|srt)$/i;
  const udAudioBulkBlocked=/\.mp3$/i;

  function udFileType(value){
    const name=String(value?.name||'');
    const type=String(value?.type||'');
    if(type.startsWith('video/')||udVideoExt.test(name))return 'Video';
    if(type.startsWith('audio/'))return 'Audio';
    if(type.startsWith('image/'))return 'Image';
    if(/\.pdf$/i.test(name))return 'PDF';
    if(/\.(ppt|pptx)$/i.test(name))return 'Presentation';
    if(/\.(zip|rar|7z)$/i.test(name))return 'Archive';
    if(/\.(csv|xls|xlsx)$/i.test(name))return 'Spreadsheet';
    if(/\.(doc|docx|rtf|txt)$/i.test(name))return 'Document';
    return 'File';
  }
  function udStatus(value){
    const raw=String(value||'success').toLowerCase();
    return raw==='ready'?'success':raw;
  }
  function udStatusLabel(value){
    const status=udStatus(value);
    return status==='processing'?'Processing':status==='failed'?'Failed':'Success';
  }
  function udAssetDate(asset){
    return asset.createdAt||asset.date||new Date().toLocaleDateString();
  }
  function udValidateBulkFile(file){
    if(!file)return 'No file selected.';
    if(file.size===0)return 'The selected file is empty.';
    if(udCaptionExt.test(file.name))return 'Caption files must be uploaded from the Captions page.';
    if(udAudioBulkBlocked.test(file.name))return 'MP3 resources must use the lecture browser uploader.';
    const video=String(file.type||'').startsWith('video/')||udVideoExt.test(file.name);
    if(video&&file.size>4*1024*1024*1024)return 'Video files must be smaller than 4 GB.';
    if(!video&&file.size>1024*1024*1024)return 'Resource files must be 1 GB or smaller.';
    if(!video&&!udResourceExt.test(file.name)&&!String(file.type||'').match(/^(image|audio|application|text)\//))return 'This file type is not supported.';
    if(/\.(html?|js)$/i.test(file.name))return 'HTML and JavaScript must be placed in a ZIP archive.';
    return '';
  }

  qaValidateFile=function(file,kind='general'){
    if(!file)return 'No file selected.';
    if(file.size===0)return 'The selected file is empty.';
    const isVideo=String(file.type||'').startsWith('video/')||udVideoExt.test(file.name);
    if(kind==='video'){
      if(!isVideo)return 'Choose a supported video file.';
      if(file.size>4*1024*1024*1024)return 'Video files must be smaller than 4 GB.';
      return '';
    }
    if(kind==='caption'){
      if(!udCaptionExt.test(file.name))return 'Caption files must be VTT or SRT.';
      if(file.size>1024*1024*1024)return 'Caption files must be 1 GB or smaller.';
      return '';
    }
    if(kind==='csv'&&!/\.csv$/i.test(file.name))return 'Choose a CSV file.';
    if(isVideo&&file.size>4*1024*1024*1024)return 'Video files must be smaller than 4 GB.';
    if(!isVideo&&file.size>1024*1024*1024)return 'Files must be 1 GB or smaller.';
    if(/\.(html?|js)$/i.test(file.name))return 'HTML and JavaScript must be placed in a ZIP archive.';
    return '';
  };

  qaImportAsset=async function(file,source='device'){
    const error=qaValidateFile(file);if(error)throw new Error(error);
    const assetId=id();
    const asset={id:assetId,name:file.name,type:file.type||'File',size:file.size,date:new Date().toLocaleDateString(),createdAt:qaDate(),duration:0,width:0,height:0,status:'processing',source};
    state.mediaLibrary.unshift(asset);persist();
    try{
      await qaPutAsset(assetId,file);
      if(String(file.type||'').startsWith('video/')||udVideoExt.test(file.name)){
        try{
          const metadata=await qaReadVideoMetadata(file);
          asset.duration=metadata.duration||0;asset.width=metadata.width||0;asset.height=metadata.height||0;
        }catch(errorValue){
          asset.status='failed';asset.error=errorValue.message||'Video processing failed.';persist();throw errorValue;
        }
      }
      asset.status='success';persist();return asset;
    }catch(errorValue){
      asset.status='failed';asset.error=errorValue.message||'Upload failed.';persist();throw errorValue;
    }
  };

  function udAppendFiles(existing,newFiles){
    const output=[...existing];
    [...newFiles].forEach(file=>{
      const duplicate=output.some(item=>item.file.name===file.name&&item.file.size===file.size&&item.file.lastModified===file.lastModified);
      if(!duplicate)output.push({id:id(),file,status:'queued',error:udValidateBulkFile(file),assetId:''});
    });
    return output;
  }

  function udBulkLibraryRows(container,assets,sortKey='date',sortDirection='desc',search=''){

    const direction=sortDirection==='asc'?1:-1;
    filtered.sort((a,b)=>{
      let av,bv;
      if(sortKey==='name'){av=a.name||'';bv=b.name||''}
      else if(sortKey==='type'){av=udFileType(a);bv=udFileType(b)}
      else if(sortKey==='status'){av=udStatusLabel(a.status);bv=udStatusLabel(b.status)}
      else{av=new Date(a.createdAt||a.date||0).getTime()||0;bv=new Date(b.createdAt||b.date||0).getTime()||0}
      return String(av).localeCompare(String(bv),undefined,{numeric:true})*direction;
    });
    container.innerHTML=filtered.length?filtered.map(asset=>`<div class="ud-library-row" data-library-asset="${asset.id}">
      <div class="row"><i data-lucide="${udFileType(asset)==='Video'?'file-video':'file'}" class="icon"></i><div><strong>${esc(asset.name)}</strong><div class="help">${qaSize(asset.size)}${asset.duration?` · ${Math.round(asset.duration)} sec`:''}</div></div></div>

  function mergedNormalizePricingState(){
    state.priceCurrency=MERGED_PRICE_TIERS[state.priceCurrency]?state.priceCurrency:'VND';

    if(state.priceTier===undefined||state.priceTier===null)state.priceTier='';

      const typeMap={'Best price':'best_price','Current best price':'best_price','Custom price':'custom_price','Free':'free_open','Free: Open':'free_open','Free: Targeted':'free_targeted'};
      const typeKey=coupon.typeKey||typeMap[coupon.type]||'best_price';
